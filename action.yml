name: greenlight
description: Record test results, gate on their flake history kept by your greenlight server, and report on the pull request.
branding:
  icon: activity
  color: orange

inputs:
  junit:
    description: JUnit XML files or globs, space separated
    required: true
  name:
    description: Tells matrix jobs apart (py3.12, chrome...). Each name gets its own PR comment.
    default: ""
  server-url:
    description: Your greenlight server (`greenlight serve`), where the history lives. Without it, the job is judged on its own results alone.
    default: ""
  server-token:
    description: The server's GREENLIGHT_TOKEN. Keep it in a secret.
    default: ""
  pr-comment:
    description: Add or update a comment on the pull request
    default: "true"
  fail-on:
    description: "real: fail only on REAL_FAILURE. any: also fail when only flaky tests failed. never: report only."
    default: real
  token:
    description: GitHub token for the PR comment (pull-requests write)
    default: ${{ github.token }}
  otlp-endpoint:
    description: OTLP/HTTP base URL. When set, this job's test run is also sent there as a trace. Put any auth header in an OTEL_EXPORTER_OTLP_HEADERS secret.
    default: ""

outputs:
  decision:
    description: PASS, RERUN_TARGETED or REAL_FAILURE
    value: ${{ steps.report.outputs.decision }}
  rerun-tests:
    description: Space-separated test ids (classname::name) to rerun when the decision is RERUN_TARGETED
    value: ${{ steps.report.outputs.rerun-tests }}
  rerun-names:
    description: The same tests by name only, for selectors like pytest -k or jest -t
    value: ${{ steps.report.outputs.rerun-names }}

runs:
  using: composite
  steps:
    - name: Install greenlight
      shell: bash
      run: |
        # Windows runners: forward slashes work for bash and Python alike, and "python3" there can be
        # the Microsoft Store stub, so use "python"
        T="${RUNNER_TEMP//\\//}"
        PY=python3; [ "$RUNNER_OS" = "Windows" ] && PY=python
        "$PY" -m venv "$T/greenlight-venv"
        BIN="$T/greenlight-venv/bin"; [ -d "$BIN" ] || BIN="$T/greenlight-venv/Scripts"
        # the CLI only needs the standard library; the MCP server's dependencies stay out of CI
        "$BIN/python" -m pip install -q --no-deps "${GITHUB_ACTION_PATH//\\//}"
        if command -v cygpath >/dev/null; then cygpath -w "$BIN"; else echo "$BIN"; fi >> "$GITHUB_PATH"
        echo "GREENLIGHT_DB=$T/greenlight.db" >> "$GITHUB_ENV"

    - name: Record this run
      shell: bash
      env:
        JUNIT: ${{ inputs.junit }}
        NAME: ${{ inputs.name }}
      run: |
        set -f  # greenlight expands the globs itself
        greenlight ci record --junit $JUNIT ${NAME:+--name "$NAME"}

    - name: Gate and report
      id: report
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        GREENLIGHT_URL: ${{ inputs.server-url }}
        GREENLIGHT_TOKEN: ${{ inputs.server-token }}
        NAME: ${{ inputs.name }}
        COMMENT: ${{ inputs.pr-comment }}
      run: |
        [ -n "$GREENLIGHT_URL" ] || echo "::notice::No greenlight server-url: judging this job on its own results, without history"
        greenlight ci report --fail-on never ${NAME:+--name "$NAME"} $([ "$COMMENT" = "true" ] && echo --pr-comment)

    - name: Send the run to OpenTelemetry
      if: inputs.otlp-endpoint != ''
      shell: bash
      continue-on-error: true
      env:
        OTEL_EXPORTER_OTLP_ENDPOINT: ${{ inputs.otlp-endpoint }}
        NAME: ${{ inputs.name }}
      run: greenlight otel export --this-job ${NAME:+--name "$NAME"}

    - name: Apply fail-on
      shell: bash
      env:
        DECISION: ${{ steps.report.outputs.decision }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        case "$FAIL_ON:$DECISION" in
          never:*|*:PASS) exit 0 ;;
          real:RERUN_TARGETED) echo "::notice::Only known flaky tests failed. Rerun just: ${{ steps.report.outputs.rerun-tests }}"; exit 0 ;;
          *) echo "::error::greenlight: $DECISION"; exit 1 ;;
        esac
