name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q --junitxml=reports/junit-${{ matrix.python }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-py${{ matrix.python }}-attempt-${{ github.run_attempt }}
          path: reports/
          retention-days: 30
