name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write   # greenlight keeps one comment on the pull request

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11", name: py3.11 }
          - { os: ubuntu-latest, python: "3.12", name: py3.12, comment: true }
          - { os: windows-latest, python: "3.12", name: windows-py3.12 }
          - { os: macos-latest, python: "3.12", name: macos-py3.12 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      # greenlight decides whether a red run fails the job, so the test step itself doesn't
      - run: pytest -q --junitxml=reports/junit.xml
        continue-on-error: true
      - uses: ./
        with:
          junit: reports/junit.xml
          name: ${{ matrix.name }}
          pr-comment: ${{ matrix.comment && 'true' || 'false' }}
          # where the history lives; with these unset, each job is judged on its own results
          server-url: ${{ secrets.GREENLIGHT_URL }}
          server-token: ${{ secrets.GREENLIGHT_TOKEN }}

  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write    # publish ghcr.io/<owner>/greenlight from main
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: greenlight:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "mcp>=2.2"
      - name: Smoke test the image (CLI, then the server reading this repo from GitHub)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm greenlight:test --version
          docker run -d --name gl -p 8000:8000 -e GREENLIGHT_REPO="$GITHUB_REPOSITORY" \
            -e GREENLIGHT_TOKEN=ci-token -e GITHUB_TOKEN="$GH_TOKEN" greenlight:test
          python .github/scripts/smoke_mcp.py http://127.0.0.1:8000 ci-token "$GITHUB_REPOSITORY" || { docker logs gl; exit 1; }
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v3
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish for amd64 and arm64 (Apple Silicon, Graviton)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
