<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>greenlight</title>
<script>try { if (localStorage.getItem("greenlight-theme") === "light") document.documentElement.dataset.theme = "light"; } catch { /* storage unavailable */ }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Dark is the default; the toggle stores "light". Surfaces follow beautifului.dev: a canvas, cards that lift off it
   with a hairline and a soft shadow instead of a border, 10px cards, 8px controls, 6px chips. Status colors are
   validated for color vision deficiency on each theme's card surface: pass, flip, fail and quarantined, all pairs. */
:root {
  color-scheme: dark;
  --side: #17181a; --bg: #1c1d1f; --panel: #232427; --panel-2: #2b2c2f; --sunk: #1f2022;
  --hover: #2a2b2e; --hover-2: #313236;
  --line: #2e3033; --line-2: #27282b; --line-strong: #3a3c40;
  --ink: #f2f3f4; --ink-2: #a5a8ad; --ink-3: #80838a;
  --accent: #3d9aff; --accent-ink: #0b1220; --wash: rgba(61, 154, 255, .15);
  --pass: #00aa82; --flip: #c08000; --fail: #c2272d; --quar: #6d78d8;
  --series: #3d9aff; --neutral: #5a5d63;
  --r-card: 10px; --r-control: 8px; --r-chip: 6px; --r-window: 14px;
  --shadow-btn: 0 0 0 1px rgba(255, 255, 255, .1), 0 1px 2px rgba(0, 0, 0, .3);
  --shadow-card: 0 0 0 1px rgba(255, 255, 255, .08), 0 1px 2px rgba(0, 0, 0, .2), 0 2px 6px rgba(0, 0, 0, .2);
  --shadow-raised: 0 0 0 1px rgba(255, 255, 255, .11), 0 2px 10px rgba(0, 0, 0, .3);
  --ease: cubic-bezier(.23, 1, .32, 1);
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300;
  --band: rgba(160, 167, 180, .17);
  --tip-bg: #111214; --shadow: 0 0 0 1px rgba(255, 255, 255, .12), 0 8px 28px rgba(0, 0, 0, .4);
}
:root[data-theme="light"] {
  color-scheme: light;
  --side: #fafafb; --bg: #f1f2f3; --panel: #ffffff; --panel-2: #f2f2f3; --sunk: #f7f8f9;
  --hover: #f4f5f6; --hover-2: #e7e9eb;
  --line: #e4e6e9; --line-2: #eeeff1; --line-strong: #dadde1;
  --ink: #1f2124; --ink-2: #5a5e64; --ink-3: #74787e;
  --accent: #0a74e6; --accent-ink: #ffffff; --wash: rgba(10, 116, 230, .09);
  --pass: #10916d; --flip: #b06a00; --fail: #b8173f; --quar: #5a63c8;
  --series: #2a78d6; --neutral: #b3b9c5;
  --shadow-btn: 0 0 0 1px #dadde1, 0 0 4px rgba(0, 0, 0, .04);
  --shadow-card: 0 0 0 1px #e8eaed, 0 18px 47px rgba(0, 0, 0, .03), 0 7.5px 19px rgba(0, 0, 0, .02), 0 4px 10.5px rgba(0, 0, 0, .02), 0 1.2px 3px rgba(0, 0, 0, .02);
  --shadow-raised: 0 0 0 1px #e4e6e9, 0 17.5px 23.4px rgba(0, 0, 0, .04), 0 9.4px 12.5px rgba(0, 0, 0, .03), 0 5.25px 7px rgba(0, 0, 0, .02);
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300;
  --band: rgba(84, 92, 106, .13);
  --tip-bg: #ffffff; --shadow: 0 0 0 1px #e4e6e9, 0 25px 50px rgba(0, 0, 0, .05), 0 12px 24px rgba(0, 0, 0, .04), 0 6px 12px rgba(0, 0, 0, .03), 0 3px 6px rgba(0, 0, 0, .02);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 13px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-feature-settings: "cv11", "ss01";
}
code, .mono { font-family: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace; font-size: .92em; }
a { color: inherit; text-decoration: none; }
a:hover { color: var(--ink); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 3px; }
[hidden] { display: none !important; }
.muted { color: var(--ink-2); }
.dim { color: var(--ink-3); }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* Shell: sidebar, top bar, content */
.app { display: grid; grid-template-columns: 212px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; background: var(--side); border-right: 1px solid var(--line-2); overflow-y: auto; z-index: 40; }
.brand { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 18px; font-weight: 650; font-size: 14px; letter-spacing: -.01em; flex: none; }
.brand svg { width: 20px; height: 20px; }
.nav { position: relative; display: flex; flex-direction: column; gap: 1px; padding: 2px 10px 12px; }
.nav .grp { font-size: 11.5px; font-weight: 500; color: var(--ink-3); padding: 14px 8px 4px; }
.nav a { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 8px; border-radius: var(--r-control); color: var(--ink-2); transition: color .15s; }
.nav a:hover { color: var(--ink); }
.nav a[aria-current] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow-btn); font-weight: 500; }
.nav a[aria-current] .ic { color: var(--accent); }
/* the hover highlight glides from row to row instead of blinking (beautifului's sidebar) */
.glide { position: absolute; left: 10px; right: 10px; height: 32px; border-radius: var(--r-control); background: var(--hover-2); opacity: 0; pointer-events: none; transition: transform .22s var(--ease), opacity .15s; }
.nav:hover .glide.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .glide { transition: opacity .15s; } }
.side-foot { margin-top: auto; padding: 10px 18px 14px; border-top: 1px solid var(--line-2); font-size: 12px; color: var(--ink-2); display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 42px; }
.sync { display: flex; align-items: center; gap: 8px; min-width: 0; }
.signout { border: 0; padding: 0; background: none; color: var(--ink-2); font-size: 12px; cursor: pointer; white-space: nowrap; }
.signout:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--pass); flex: none; }
.pulse.off { background: var(--ink-3); }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 20px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line-2); }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; color: var(--ink-3); }
.crumbs a:hover { color: var(--ink); }
.crumbs .ic { width: 12px; height: 12px; }
.crumbs h1 { margin: 0; font-size: 14px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.crumbs > span { white-space: nowrap; }
.tb { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border: 0; border-radius: var(--r-control); background: var(--panel); box-shadow: var(--shadow-btn); color: var(--ink-2); cursor: pointer; white-space: nowrap; font-size: 12.5px; font-weight: 500; transition: background-color .1s, color .1s, transform .1s; }
.tb:hover { color: var(--ink); background: var(--hover); }
.tb:active { transform: scale(.97); }
.tb.icon { width: 30px; padding: 0; justify-content: center; }
.tb[aria-disabled="true"] { opacity: .5; cursor: default; }
.tb[aria-disabled="true"]:hover { color: var(--ink-2); background: var(--panel); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--wash); color: var(--ink); font-size: 12px; white-space: nowrap; }
/* filter chips: a status's dot, its name, its count; the picked one lifts like a button (beautifului's filter table) */
.chips { display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.chips a { display: inline-flex; flex: none; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; color: var(--ink-2); font-size: 12px; font-weight: 500; white-space: nowrap; transition: background-color .2s, box-shadow .2s, color .2s; }
.chips a:hover { background: var(--hover); color: var(--ink); }
.chips a[aria-current="true"] { background: var(--panel); color: var(--ink); box-shadow: var(--shadow-btn); }
.chips a i { width: 6px; height: 6px; border-radius: 50%; background: var(--c, var(--ink-3)); flex: none; }
.chips a .n { padding: 0 4px; border-radius: 4px; font-size: 10.5px; font-variant-numeric: tabular-nums; color: var(--ink-3); }
.chips a[aria-current="true"] .n { background: var(--panel-2); color: var(--ink-2); }
.fbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
.fbar .vars { gap: 6px; }
.pfb { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 14px; border-bottom: 1px solid var(--line-2); }
kbd { display: inline-flex; align-items: center; height: 18px; padding: 0 5px; border-radius: 5px; background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--ink-3); font: 500 10.5px/1 "Inter", system-ui, sans-serif; }
.tb.search { min-width: 200px; justify-content: flex-start; color: var(--ink-3); }
.tb.search kbd { margin-left: auto; }
@media (max-width: 720px) { .tb.search { min-width: 0; width: 30px; padding: 0; justify-content: center; } .tb.search .lbl, .tb.search kbd { display: none; } }
.glide { top: 0; }
.bad { color: var(--fail); }
.good { color: var(--pass); }
.cnt { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 5px; background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-2); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
/* command search */
.cmdk { position: fixed; inset: 0; z-index: 80; display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 16px; background: rgba(0, 0, 0, .35); backdrop-filter: blur(2px); }
.cmdk-box { width: min(620px, 100%); max-height: 70vh; display: flex; flex-direction: column; background: var(--panel); border-radius: var(--r-card); box-shadow: var(--shadow); overflow: hidden; animation: pop .16s var(--ease); }
.cmdk-in { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-bottom: 1px solid var(--line); color: var(--ink-3); }
.cmdk-in input { flex: 1; min-width: 0; border: 0; background: none; color: var(--ink); font: inherit; font-size: 14px; outline: none; }
.cmdk-in input::placeholder { color: var(--ink-3); }
.cmdk-list { position: relative; overflow-y: auto; padding: 6px; }
.cmdk-list .glide { left: 6px; right: 6px; background: var(--hover-2); opacity: 1; height: 34px; }
.cmdk-list .kh { position: relative; z-index: 1; padding: 8px 8px 4px; color: var(--ink-3); font-size: 11.5px; font-weight: 500; }
.cmdk-list .ci { position: relative; z-index: 1; display: flex; align-items: baseline; gap: 10px; width: 100%; min-height: 34px; padding: 7px 8px; border: 0; border-radius: var(--r-chip); background: none; text-align: left; cursor: pointer; color: var(--ink); }
.cmdk-list .ci .cl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
.cmdk-list .ci .cs { margin-left: auto; flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-3); font-size: 12px; }
body.cmdk-open { overflow: hidden; }
/* insight cards */
.insight .say { margin: 2px 0 8px; color: var(--ink-2); font-size: 13px; line-height: 1.6; }
.insight .say b { color: var(--ink); font-weight: 600; }
.insight .say .bad, .insight .say .good { font-weight: 600; }
.mvs { display: grid; gap: 6px; margin-bottom: 12px; }
.mv { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; font-size: 12.5px; }
.mv .mono { flex: none; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.ent { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; height: 22px; padding: 0 8px 0 6px; border-radius: 11px; background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line-2); font-weight: 500; }
.ent i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
.ent a { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.ent a:hover { color: var(--accent); }
.icard { padding: 10px 12px 6px; border-radius: var(--r-card); background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line-2); }
.ilg { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin-bottom: 6px; }
.ilg > div { display: grid; gap: 1px; }
.ilg span { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 11.5px; }
.ilg span i { width: 8px; height: 8px; border-radius: 50%; }
.ilg span i.dash { width: 12px; height: 2px; border-radius: 0; background: repeating-linear-gradient(90deg, var(--ink-3) 0 4px, transparent 4px 7px); }
.ilg b { font-size: 17px; font-weight: 600; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.ilg .lnk { margin-left: auto; }
/* recommendation cards */
.recs .pb { display: grid; gap: 8px; align-content: start; }
.rec { padding: 11px 12px; border-radius: var(--r-card); background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line-2); }
.rec .rt { display: flex; align-items: flex-start; gap: 8px; }
.rec .rh { font-size: 13px; font-weight: 600; line-height: 1.35; }
.rec p { margin: 4px 0 8px; color: var(--ink-2); font-size: 12.5px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.drawer .rec p { -webkit-line-clamp: unset; }
.rec .ra { display: flex; align-items: center; gap: 10px; }
.rec .ra .tb { height: 26px; }
.recs > .recs, .db .recs { display: grid; gap: 8px; }
.recs .more { justify-self: start; font-size: 12.5px; }
.sig3 { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; padding-top: 3px; flex: none; }
.sig3 i { width: 4px; border-radius: 2px; background: var(--line-strong); }
.sig3 i.on { background: var(--accent); }
/* context cards */
.ctx { margin-bottom: 12px; }
.cc { padding: 0; text-decoration: none; color: inherit; overflow: hidden; }
.cc .cbar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line-2); }
.cc .cl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; font-weight: 500; }
.cc .cbar .dim { margin-left: auto; flex: none; font-size: 12px; font-variant-numeric: tabular-nums; }
.cc p { margin: 0; padding: 8px 12px 4px; color: var(--ink-2); font-size: 12.5px; line-height: 1.5; }
.cc p b { color: var(--ink); font-weight: 600; }
.cc .cf { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 12px 12px; font-size: 12px; }
.cc .src { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px 0 4px; border-radius: 12px; background: var(--sunk); box-shadow: var(--shadow-btn); color: var(--ink-2); font-weight: 500; }
.bdg { display: inline-flex; align-items: center; height: 16px; padding: 0 4px; border-radius: 4px; color: #fff; font-size: 9px; font-weight: 700; letter-spacing: .02em; }
.box { border-radius: var(--r-control); box-shadow: inset 0 0 0 1px var(--line-2); overflow: hidden; }
.ask .pb { display: grid; gap: 8px; padding: 16px; }
.ask .q { margin: 0; font-size: 14px; font-weight: 600; }
.ask .dim { margin: 0; max-width: 80ch; line-height: 1.5; }
.picker { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); min-width: 190px; padding: 4px; background: var(--panel); border-radius: var(--r-card); box-shadow: var(--shadow); z-index: 50; transform-origin: top right; animation: pop .14s var(--ease); }
@keyframes pop { from { opacity: 0; transform: scale(.96); } }
.menu button { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 9px; border: 0; border-radius: var(--r-chip); background: none; text-align: left; cursor: pointer; color: var(--ink); font-size: 13px; }
.menu button:hover, .menu button:focus-visible { background: var(--hover-2); outline: none; }
.menu button .ic { visibility: hidden; color: var(--accent); stroke-width: 2.2; }
.menu button[aria-checked="true"] { font-weight: 600; }
.menu button[aria-checked="true"] .ic { visibility: visible; }
#menu-btn { display: none; }
.scrim { display: none; }
#view { padding: 16px 20px 56px; min-width: 0; }
#view:focus { outline: none; }
#view.busy { opacity: .6; transition: opacity .15s .15s; }
#bar { position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 60; overflow: hidden; pointer-events: none; }
#bar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { left: -30%; } to { left: 100%; } }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; top: 0; bottom: 0; left: 0; width: 240px; height: auto; transform: translateX(-100%); transition: transform .18s ease; padding-top: env(safe-area-inset-top, 0px); }
  body.nav-open .side { transform: none; box-shadow: var(--shadow); }
  body.nav-open .scrim { display: block; position: fixed; inset: 0; z-index: 35; background: rgba(0, 0, 0, .45); }
  #menu-btn { display: inline-flex; }
  .top { top: env(safe-area-inset-top, 0px); padding: 0 12px; }
  #view { padding: 10px 12px 40px; }
}
@media (max-width: 560px) {
  .crumbs > span, .crumbs > a, .crumbs > .ic { display: none; }
  #range-label { display: none; }
}

/* Panels: a 12 column grid, 8px gutters */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; }
.grid + .grid, .grid + .row-title, .row-title + .grid, .vars + .grid { margin-top: 12px; }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; }
.s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
@media (max-width: 1100px) { .s3 { grid-column: span 6; } .s5, .s7 { grid-column: span 12; } }
@media (max-width: 900px) { .s4.panel:not(.stat), .s4.stack, .s6, .s8 { grid-column: span 12; } }
.stack { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.stack .stat { flex: 1 0 auto; min-height: 0; }
.stack .stat .s { white-space: normal; }
.meter { display: inline-block; width: 64px; height: 6px; margin-right: 6px; vertical-align: middle; border-radius: 3px; background: var(--line-2); overflow: hidden; }
.meter i { display: block; height: 100%; min-width: 2px; border-radius: 3px; background: var(--series); }
@media (max-width: 560px) { .s4:not(.stat) { grid-column: span 12; } }
.start { align-self: start; }
.panel { position: relative; display: flex; flex-direction: column; min-width: 0; background: var(--panel); border-radius: var(--r-card); box-shadow: var(--shadow-card); }
a.panel { transition: box-shadow .2s var(--ease), transform .2s var(--ease); }
a.panel:hover { box-shadow: var(--shadow-raised); transform: translateY(-1px); }
.ph { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; min-height: 40px; padding: 8px 12px 4px 14px; }
.ph h2 { margin: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pa { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }
.pb { flex: 1; min-width: 0; padding: 4px 14px 14px; }
.pb.flush { padding: 0; border-top: 1px solid var(--line-2); }
.pf { padding: 8px 12px; border-top: 1px solid var(--line-2); color: var(--ink-2); font-size: 12px; }
.info { display: inline-flex; padding: 0; border: 0; background: none; color: var(--ink-3); cursor: help; }
.info:hover, .info:focus-visible { color: var(--ink); }
.info .ic { width: 14px; height: 14px; }
.row-title { display: flex; align-items: center; gap: 8px; padding: 10px 2px 2px; font-size: 13px; font-weight: 600; }
.row-title .ic { color: var(--ink-3); }
.lnk { color: var(--accent); font-weight: 500; white-space: nowrap; }
.lnk:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.vars { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.var { display: inline-flex; align-items: stretch; height: 30px; border-radius: var(--r-control); overflow: hidden; background: var(--panel); box-shadow: var(--shadow-btn); }
.var span { display: flex; align-items: center; padding: 0 10px; background: var(--panel-2); color: var(--ink-2); border-right: 1px solid var(--line); font-size: 12px; }
.var select { border: 0; background: var(--panel); color: var(--ink); font: inherit; padding: 0 8px; min-width: 0; max-width: 240px; text-overflow: ellipsis; }
.var { max-width: 100%; }
.vars .lnk { font-size: 12.5px; }
.tabs + .vars { margin-bottom: 8px; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tb.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.tb.primary:hover { color: var(--accent-ink); filter: brightness(1.08); }

.ed { display: grid; gap: 10px; }

.ed textarea.inp { height: auto; min-height: 170px; padding: 8px 9px; resize: vertical; font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-size: 12.5px; line-height: 1.5; tab-size: 2; }
.ed .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.perr { margin: 0; padding: 8px 10px; border-left: 2px solid var(--fail); background: var(--panel-2); color: var(--ink); font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.bignum { font-size: 34px; font-weight: 600; letter-spacing: -.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.ranked { display: grid; gap: 7px; }
.ranked > div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 10px; align-items: center; font-size: 12.5px; }

.ranked .val { font-variant-numeric: tabular-nums; }
.ranked .rb { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
.ranked .rb i { display: block; height: 100%; min-width: 2px; border-radius: 0 3px 3px 0; background: var(--series); }
.schema details { border-top: 1px solid var(--line-2); padding: 6px 0; }
.schema summary { cursor: pointer; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.schema ul { margin: 6px 0 2px; padding-left: 18px; display: grid; gap: 3px; font-size: 12px; }
.dpl:empty { display: none; }
.dpl { margin-top: 8px; }
.lede { margin: 0 0 10px; max-width: 72ch; color: var(--ink-2); line-height: 1.5; }
.dhead { display: grid; gap: 6px; margin-bottom: 8px; }
.dhead .lede { margin: 0; }
.dbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.dbar .vars.right { margin-left: auto; }
.dbar .var .ic { width: 14px; height: 14px; }
.tb.ghost { border-color: transparent; background: none; }
.tb.ghost:hover { border-color: var(--line); }
.dp .ph { min-height: 34px; }
.dpb { min-height: 40px; }
.dstat .pb { display: flex; flex-direction: column; }
.sv { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; font-size: 12px; min-height: 20px; }
.ssp { height: 34px; margin-top: 8px; display: flex; }
.ssp .spark { width: 100%; height: 100%; }
.delta { display: inline-flex; align-items: center; gap: 2px; padding: 1px 6px 1px 3px; border-radius: 6px; background: var(--panel-2); color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.delta .ic { width: 13px; height: 13px; stroke-width: 2.2; }
.delta.bad { color: var(--fail); background: color-mix(in srgb, var(--fail) 13%, transparent); }
.delta.good { color: var(--pass); background: color-mix(in srgb, var(--pass) 13%, transparent); }
.ranked .rb i.warn { background: var(--flip); }
.ranked .rb i.bad { background: var(--fail); }
.drow { display: flex; align-items: center; gap: 8px; padding: 10px 2px 2px; }
.drow > button:first-child { display: inline-flex; align-items: center; gap: 8px; padding: 0; border: 0; background: none; color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }

.drow .dim { font-weight: 400; font-size: 12px; }
.lgs { gap: 4px 6px; }
.lg { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 7px; border: 0; border-radius: 6px; background: none; color: var(--ink-2); font: inherit; font-size: 12px; cursor: pointer; }
.lg:hover { background: var(--panel-2); color: var(--ink); }

.lg.static:hover { background: none; color: var(--ink-2); }
.lg .ll { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 28ch; }

.sw.dash { background: repeating-linear-gradient(90deg, var(--ink-3) 0 5px, transparent 5px 9px) !important; }
.tr.ev .sw.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-2); }
.chart .thr { stroke-width: 1.5; stroke-dasharray: 3 3; opacity: .8; }
.chart .mark { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 2 4; opacity: .45; }
.chart .mark-m { fill: var(--ink-2); stroke: var(--panel); stroke-width: 1.5; }
.chart .ann { stroke: var(--ink-2); stroke-width: 1.5; }
.chart text.ann-t { fill: var(--ink); font-weight: 600; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
.tr.ev .sw.ann { width: 2px; height: 12px; border-radius: 1px; background: var(--ink-2); }
.pmenu { position: fixed; right: auto; top: 0; }
.pmenu button .ic { visibility: visible; color: var(--ink-3); stroke-width: 1.5; }
.dcard { padding: 14px 14px 12px; gap: 6px; text-decoration: none; color: inherit; min-height: 96px; }
.dcard .dt { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.dcard .dt .ic { color: var(--accent); }
.dcard .dd { color: var(--ink-2); font-size: 12.5px; line-height: 1.45; }
.dcard .dim { margin-top: auto; font-size: 12px; }
.md { line-height: 1.55; }
.md p, .md ul, .md h3 { margin: 0 0 8px; }
.md h3 { font-size: 13px; }
.code { position: relative; border: 1px solid var(--line-2); border-radius: 6px; background: var(--sunk); }
.code > .tb { position: absolute; top: 6px; right: 6px; }
.code pre { margin: 0; padding: 10px 44px 10px 0; overflow-x: auto; font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-size: 12px; line-height: 1.6; }
.code .ln { display: inline-block; width: 2.6em; padding-right: 10px; margin-right: 10px; text-align: right; color: var(--ink-3); border-right: 1px solid var(--line-2); user-select: none; }
.code .k { color: var(--accent); font-weight: 600; }
.code .s { color: var(--pass); }
.code .p { color: var(--flip); }
.ed .three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.ed .checks { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.ed .chk { display: inline-flex; grid-auto-flow: column; align-items: center; gap: 6px; color: var(--ink); font-size: 12.5px; }
.ed .fg[hidden] { display: none; }
.ed textarea.short { min-height: 70px; }
.ed textarea.json, textarea.json { width: 100%; min-height: 220px; padding: 8px 9px; font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-size: 12px; line-height: 1.5; resize: vertical; }
.ed fieldset { margin: 0; padding: 10px; border: 1px solid var(--line-2); border-radius: 6px; display: grid; gap: 8px; }
.ed fieldset + fieldset { margin-top: 8px; }
#vrows, #arows { display: grid; gap: 8px; margin-bottom: 8px; }
body.tv .side, body.tv .top { display: none; }
body.tv .app { grid-template-columns: minmax(0, 1fr); }
.tvx { position: fixed; right: 12px; bottom: 12px; z-index: 30; box-shadow: var(--shadow); }
.copy { display: flex; align-items: center; gap: 6px; min-width: 0; }
.copy code { min-width: 0; overflow-x: auto; white-space: nowrap; padding: 4px 6px; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 4px; user-select: all; }

/* Stat tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { padding: 12px 14px 14px; min-height: 100px; justify-content: space-between; gap: 6px; }
.stat .k { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 12px; font-weight: 500; }
.stat .vr { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.stat .v { font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; white-space: nowrap; }
.stat .v small { font-size: 13px; font-weight: 500; color: var(--ink-2); margin-left: 3px; letter-spacing: 0; }
.stat .s { color: var(--ink-2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spark { flex: 0 1 48%; height: 30px; min-width: 0; display: block; overflow: visible; }
@media (max-width: 560px) {
  .stat { min-height: 84px; padding: 8px 10px 10px; }
  .stat .v { font-size: 21px; }
  .s4.stat .spark, .s4.stat .s { display: none; }
}

/* Status tags: shape and label carry the state, color backs them up */
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 0 8px 0 7px; border-radius: 11px; line-height: 22px; font-size: 11.5px; font-weight: 500; white-space: nowrap; color: var(--ink); background: color-mix(in srgb, var(--c) 15%, transparent); }
.tag i { width: 7px; height: 7px; flex: none; border-radius: 2px; background: var(--c); }
.tag.lg { font-size: 13px; line-height: 24px; padding: 0 10px 0 8px; gap: 8px; }
.tag.lg i { width: 10px; height: 10px; }
.st-pass { --c: var(--pass); } .st-pass i { border-radius: 50%; }
.st-fail { --c: var(--fail); } .st-fail i { border-radius: 1px; }
.st-flip, .st-flip-o { --c: var(--flip); } .st-flip i, .st-flip-o i { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.st-flip-o i { opacity: .55; }
.st-quar { --c: var(--quar); } .st-quar i { transform: rotate(45deg) scale(.8); border-radius: 1px; }
.st-neutral { --c: var(--ink-3); } .st-neutral i { border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
.st-run { --c: var(--accent); } .st-run i { border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 2px var(--c); }
.tags { display: inline-flex; flex-wrap: wrap; gap: 4px; }

/* Tables */
.tw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.t th { text-align: left; font-weight: 500; font-size: 11.5px; color: var(--ink-3); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--sunk); }
.t th[data-col] { cursor: pointer; user-select: none; }
.t th[data-col]:hover { color: var(--ink); }
.t th[aria-sort="ascending"]::after { content: " \2191"; color: var(--accent); }
.t th[aria-sort="descending"]::after { content: " \2193"; color: var(--accent); }
.t td { padding: 8px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; line-height: 20px; transition: background-color .1s; }
.t td .sub, .t td .why { line-height: 1.45; }
.t tr:last-child td { border-bottom: 0; }
.t th:first-child, .t td:first-child { padding-left: 14px; }
.t th:last-child, .t td:last-child { padding-right: 14px; }
.t tbody tr:hover td { background: var(--hover); }
.t tr[data-href] { cursor: pointer; }
.t .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.t .nw { white-space: nowrap; }
.t .wrap { min-width: 13rem; overflow-wrap: anywhere; }
.t .act { text-align: right; white-space: nowrap; }
.t .fit { width: 1%; white-space: nowrap; }
.show-sm { display: none !important; }
.t a.tl:hover { color: var(--accent); }
.t .sub { color: var(--ink-3); font-size: 11.5px; overflow-wrap: anywhere; }
.more { padding: 8px 12px; border-top: 1px solid var(--line-2); }
.empty { margin: 0; padding: 14px 12px; color: var(--ink-2); }
.tb:disabled { opacity: .4; cursor: default; }
.tb:disabled:hover { color: var(--ink-2); border-color: var(--line); }
.pager { display: flex; align-items: center; justify-content: flex-end; gap: 6px; padding: 8px 14px; border-top: 1px solid var(--line-2); color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.pager .tb { height: 26px; }
.pager .tb.icon { width: 26px; }
.t tr[data-panel] { cursor: pointer; }
.t tr[data-panel]:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.t tbody tr.sel td { background: var(--wash); }
.t tbody tr.sel td:first-child { box-shadow: inset 2px 0 0 var(--accent); }

/* Tabs inside a page: one screen each, linkable */
.tabs { display: flex; width: fit-content; max-width: 100%; gap: 2px; margin: 14px 0 12px; padding: 3px; border-radius: var(--r-control); background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line-2); overflow-x: auto; scrollbar-width: none; }
.tabs a { display: inline-flex; flex: none; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: var(--r-chip); color: var(--ink-2); font-size: 12.5px; font-weight: 500; white-space: nowrap; transition: background-color .2s, box-shadow .2s, color .2s; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); background: var(--panel); box-shadow: var(--shadow-btn); }
.tabs .n { color: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }

/* Side panel: details beside the list, in the URL (?panel=kind:id), scrolling on its own */
.drawer { position: fixed; top: 8px; right: 8px; bottom: 8px; z-index: 60; width: min(560px, calc(100vw - 16px)); display: flex; flex-direction: column; background: var(--panel); border-radius: var(--r-window); box-shadow: var(--shadow); overflow: hidden; }
@media (max-width: 560px) { .drawer { top: 0; right: 0; bottom: 0; width: 100vw; border-radius: 0; } }
.drawer[hidden] { display: none; }
.drawer:focus { outline: none; }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slidein .16s ease-out; } }
@keyframes slidein { from { transform: translateX(24px); opacity: 0; } }
.dh { display: flex; align-items: flex-start; gap: 8px; padding: calc(12px + env(safe-area-inset-top, 0px)) 12px 12px 18px; border-bottom: 1px solid var(--line-2); }
.dh .dt { flex: 1; min-width: 0; padding-top: 4px; }
.dh h2 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.dh .ds { margin-top: 2px; color: var(--ink-2); font-size: 12px; overflow-wrap: anywhere; }
.dh .da, .dh .dn { display: flex; gap: 6px; flex: none; }
.db { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 16px; padding: 14px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
.db > * { flex-shrink: 0; }
.db section > h3 { display: flex; align-items: center; gap: 6px; margin: 0 0 6px; color: var(--ink-2); font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.db .box { border-radius: var(--r-card); box-shadow: var(--shadow-card); overflow: hidden; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.facts > div { min-width: 0; padding: 10px 12px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line-2); border-radius: var(--r-control); }
.facts .k { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 11.5px; }
.facts .v { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brief { margin: 0; padding: 10px 12px; background: var(--sunk); border: 1px solid var(--line-2); border-radius: 4px; font-size: 12px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.advice { margin: 0; padding: 10px 12px; border-radius: var(--r-control); background: var(--wash); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 22%, transparent); line-height: 1.5; }
@media (max-width: 560px) { .drawer { border-left: 0; } .dh .da .lbl { display: none; } }
@media (min-width: 1680px) { body.panel-open .main { margin-right: 560px; } }
.pb > .empty { padding: 10px 0 4px; }
@media (max-width: 720px) {
  .t .hide-sm { display: none; }
  .t .show-sm { display: flex !important; }
  .t th, .t td { padding-left: 8px; padding-right: 8px; }
  .t .wrap { min-width: 9rem; }
}

/* Controls */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: var(--r-control); border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 500; font-size: 12.5px; cursor: pointer; white-space: nowrap; transition: transform .1s, filter .1s; }
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(.97); }
.btn.ghost { background: var(--panel); color: var(--ink); box-shadow: var(--shadow-btn); }
.btn.ghost:hover { background: var(--hover); filter: none; }
.btn.sm { height: 24px; padding: 0 9px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.inp { height: 30px; padding: 0 10px; border: 0; border-radius: var(--r-control); background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--ink); font: inherit; min-width: 0; width: 200px; transition: box-shadow .1s; }
.inp:focus { outline: none; box-shadow: inset 0 0 0 1.5px var(--accent), 0 0 0 3px var(--wash); }
.chk { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); white-space: nowrap; cursor: pointer; }
.chk input { accent-color: var(--accent); margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { padding: 0 10px; height: 26px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; font-size: 12px; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--wash); color: var(--ink); font-weight: 500; }
.qform { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.qform .inp { width: 260px; }
@media (max-width: 720px) { .inp, .qform .inp { width: 100%; font-size: 16px; } .pa:has(input) { width: 100%; justify-content: flex-start; } .bar2 > .qform { width: 100%; } }

/* Gate */
.gate { display: flex; flex-direction: column; gap: 8px; }
.gate .head { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.ids { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.ids a { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-size: 12px; overflow-wrap: anywhere; }
.ids a:hover { color: var(--accent); }
.kv { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--ink-2); font-size: 12px; }
.kv b { color: var(--ink); font-weight: 500; }
.kv a { color: var(--accent); }

/* Entity header on detail pages */
.ent { padding: 12px; gap: 8px; }
.ent .cls { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; color: var(--ink-3); font-size: 12px; overflow-wrap: anywhere; }
.ent .name { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-size: 17px; font-weight: 500; overflow-wrap: anywhere; line-height: 1.3; }
.ent .title { font-size: 17px; font-weight: 600; }
.ent .bar2 { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }

/* Flake field and strips: bar height is the share of runs that failed; amber means pass and fail on one commit */
.hm { display: flex; flex-direction: column; gap: 1px; }
.hmr { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr); gap: 12px; align-items: end; padding: 3px 0; }
a.hmr:hover .n { color: var(--accent); }
.hmr .n { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hmr .n .q { color: var(--quar); }
.cells { display: flex; align-items: flex-end; gap: 2px; height: 22px; }
.cells i { flex: 1 1 0; min-width: 2px; height: 30%; background: var(--pass); border-radius: 2px 2px 0 0; }
.cells i.f { height: 100%; background: var(--fail); }
.cells i.x { height: 100%; background: var(--flip); }
.cells i.n { height: 2px; background: var(--line); border-radius: 0; }
.hmx { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr); gap: 12px; color: var(--ink-3); font-size: 11px; padding-top: 4px; }
.hmx > span:last-child { display: flex; justify-content: space-between; }
@media (max-width: 720px) { .hmr, .hmx { grid-template-columns: minmax(0, 1fr); gap: 3px; } .hmx > span:first-child { display: none; } }
.strip { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; vertical-align: middle; width: 150px; }
.strip i { flex: 1 1 0; min-width: 1px; max-width: 4px; height: 35%; background: var(--pass); border-radius: 1px 1px 0 0; }
.strip i.f { height: 100%; background: var(--fail); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--ink-2); font-size: 12px; }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex: none; }
.sw.ln { height: 2px; width: 14px; border-radius: 1px; }
.score { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
.score .track { width: 52px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.score b { display: block; height: 100%; background: var(--flip); border-radius: 2px; }

/* Charts */
.chart { width: 100%; min-height: 60px; }
.chart svg { display: block; overflow: visible; touch-action: pan-y; }
.chart .grid { stroke: var(--line-2); stroke-width: 1; }
.chart .axis { stroke: var(--line); stroke-width: 1; }
.chart text { fill: var(--ink-3); font-size: 11px; font-family: inherit; font-variant-numeric: tabular-nums; }
.chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .band { fill: var(--band); }
.chart .median { fill: none; stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 4 3; }
.chart .future { fill: var(--panel-2); }
.chart .cursor { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .colband { fill: var(--ink); opacity: .06; }
#tip { position: fixed; z-index: 70; pointer-events: none; max-width: 300px; padding: 8px 10px; border-radius: var(--r-control); background: var(--tip-bg); color: var(--ink); box-shadow: var(--shadow); font-size: 12px; line-height: 1.5; }
#tip .th { font-weight: 600; margin-bottom: 2px; }
#tip .tr { display: flex; align-items: center; gap: 8px; }
#tip .tr span { color: var(--ink-2); flex: 1; }
#tip .tr b { font-weight: 600; font-variant-numeric: tabular-nums; }
#tip .sw { width: 8px; height: 8px; }

/* Messages, run failures, pipeline waterfall */
.msg { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-size: 11.5px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--sunk); border: 1px solid var(--line-2); border-radius: 3px; padding: 6px 8px; margin: 6px 0 0; max-height: 9.5em; overflow: auto; color: var(--ink-2); }
.sigs { display: flex; flex-direction: column; }
.sig { padding: 10px 12px; border-bottom: 1px solid var(--line-2); }
.sig:last-child { border-bottom: 0; }
.why { color: var(--ink-2); font-size: 12px; margin-top: 2px; }
.wf { font-size: 12.5px; }
.wr { display: grid; grid-template-columns: minmax(0, 14rem) minmax(0, 1fr) 4.5rem; gap: 12px; align-items: center; padding: 5px 12px; border-bottom: 1px solid var(--line-2); }
.wr.wax { color: var(--ink-3); font-size: 11px; border-bottom: 1px solid var(--line); padding-top: 7px; padding-bottom: 7px; background: var(--panel-2); }
.wr .wn { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wr .wn .ic { width: 12px; height: 12px; color: var(--ink-3); transition: transform .12s; }
.wr .num { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.track { position: relative; height: 16px; background-image: linear-gradient(to right, var(--line-2) 1px, transparent 1px); }
.wax .track { background: none; height: 14px; }
.wax .track b { position: absolute; top: 0; font-weight: 400; transform: translateX(-50%); white-space: nowrap; }
.wax .track b:first-child { transform: none; }
.wax .track b:last-child { transform: translateX(-100%); }
.bar { position: absolute; top: 2px; height: 12px; min-width: 3px; border-radius: 0 3px 3px 0; background: var(--c); }
.bar.thin { top: 5px; height: 6px; opacity: .85; }
details.wj > summary { list-style: none; cursor: pointer; }
details.wj > summary::-webkit-details-marker { display: none; }
details.wj > summary:hover { background: var(--panel-2); }
details.wj[open] > summary .wn .ic { transform: rotate(90deg); }
.wr.sub { padding-top: 3px; padding-bottom: 3px; color: var(--ink-2); font-size: 12px; }
.wr.sub .wn { padding-left: 18px; }
@media (max-width: 720px) { .wr { grid-template-columns: minmax(0, 1fr) 4rem; } .wr .track { grid-column: 1 / -1; order: 3; } .wr.wax span:first-child, .wr.wax span:last-child { display: none; } .wr.wax { grid-template-columns: minmax(0, 1fr); } }

.err { margin: 0; padding: 12px; border-left: 3px solid var(--fail); background: var(--panel); border-radius: 4px; }
.err p { margin: 0 0 6px; }
.err p:last-child { margin: 0; }
.skel { min-height: 96px; box-shadow: var(--shadow-card); background: linear-gradient(100deg, var(--panel) 30%, var(--hover) 50%, var(--panel) 70%) 0 0 / 300% 100%; animation: shimmer 1.6s var(--ease) infinite; }
.skel.tall { min-height: 240px; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
@media (prefers-reduced-motion: reduce) { .skel, #bar::after { animation: none; } }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80; padding: 8px 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--tip-bg); color: var(--ink); box-shadow: var(--shadow); opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100vw - 32px); }
#toast.show { opacity: 1; }
</style>

<script>
"use strict";
const SNAP = JSON.parse(document.getElementById("snapshot").textContent || "null");
const LIVE = !SNAP;
const NOW = SNAP ? new Date(SNAP.generated_at) : new Date();
const view = document.getElementById("view");
const RANGES = [1, 7, 14, 30, 90];
const rangeName = n => n === 1 ? "Last 24 hours" : `Last ${n} days`;
let DAYS = SNAP ? SNAP.days : (() => { try { return Number(localStorage.getItem("greenlight-days")) || 30; } catch { return 30; } })();
let renderToken = 0;

/* ---------- data ---------- */
class ApiError extends Error { constructor(msg, status) { super(msg); this.status = status; } }
function snapKey(path, params) {
  return path + "?" + Object.keys(params).sort().map(k => `${k}=${params[k]}`).join("&");
}
/* relative URLs, so a page served under /<token>/ keeps the token on every call */
async function api(path, params = {}) {
  const p = Object.fromEntries(Object.entries(params).map(([k, v]) => [k, String(v)]));
  if (SNAP) {
    const r = SNAP.responses[snapKey(path, p)];
    if (!r) throw new ApiError("This view isn't in the snapshot. Open the live dashboard to see it.", 404);
    if (r.__status) throw new ApiError(r.error, r.__status);
    return r;
  }
  const qs = new URLSearchParams(p).toString(), url = path.slice(1) + (qs ? "?" + qs : "");
  const hit = CACHE.get(url);
  if (hit && Date.now() - hit.t < 30000) return hit.data;
  const res = await fetch(url);
  let data = {};
  try { data = await res.json(); } catch { /* non-JSON error */ }
  if (!res.ok) throw new ApiError(data.error || `${res.status} ${res.statusText}`, res.status);
  CACHE.set(url, { t: Date.now(), data });
  return data;
}
/* a tab switch or a side panel reuses what was fetched in the last 30 seconds; refresh and writes clear it */
const CACHE = new Map();
async function post(path, body) {
  CACHE.clear();
  const res = await fetch(path.slice(1), { method: "POST", headers: { "Content-Type": "application/json", "X-Greenlight": "1" }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new ApiError(data.error || res.statusText, res.status);
  return data;
}

/* ---------- formatting ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
/* a code identity is "<sha>", "<sha>@<matrix entry>" or either plus "+<hash>" for uncommitted edits */
function sha(s) {
  const raw = String(s || ""), [base, edits] = raw.split("+"), [commit, env] = base.split("@");
  return `<code>${esc(commit.slice(0, 8))}</code>` + (env ? ` <span class="muted">on ${esc(env)}</span>` : "") + (edits ? ` <span class="muted">+ edits</span>` : "");
}
const plural = (n, word, many) => `${n} ${n === 1 ? word : (many || word + "s")}`;
const pct = x => x == null || isNaN(x) ? "n/a" : `${Math.round(x * 100)}%`;
const testHref = id => "#/test/" + encodeURIComponent(id);
const pipeHref = id => "#/pipeline/" + encodeURIComponent(id);
const splitId = id => { const i = id.lastIndexOf("::"); return i < 0 ? ["", id] : [id.slice(0, i), id.slice(i + 2)]; };
const isUrl = u => u && /^https:\/\//.test(u);
const full = iso => iso ? new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "";
function ago(iso) {
  if (!iso) return "never";
  const s = (NOW - new Date(iso)) / 1000;
  if (s < 90) return "just now";
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  if (s < 86400 * 45) return `${Math.round(s / 86400)}d ago`;
  return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}
const when = iso => `<span data-tip="${esc(full(iso))}">${esc(ago(iso))}</span>`;
function dur(ms) {
  if (ms == null) return "n/a";
  if (ms < 1000) return `${Math.round(ms)} ms`;
  const s = ms / 1000;
  if (s < 60) return `${s.toFixed(s < 10 ? 2 : 1)} s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ${Math.round(s % 60)}s`;
  return `${Math.floor(m / 60)}h ${m % 60}m`;
}
const fmtDay = d => new Date(String(d).slice(0, 10) + "T00:00:00Z").toLocaleDateString(undefined, { month: "short", day: "numeric", timeZone: "UTC" });
function hrs(h) {
  if (h == null) return "n/a";
  if (h < 1) return `${Math.max(1, Math.round(h * 60))} min`;
  if (h < 48) return `${+h.toFixed(h < 10 ? 1 : 0)} h`;
  return `${+(h / 24).toFixed(1)} days`;
}
function tk(n) {
  if (n == null) return "n/a";
  const a = Math.abs(n);
  return a >= 1e9 ? `${+(n / 1e9).toFixed(1)}B` : a >= 1e6 ? `${+(n / 1e6).toFixed(1)}M` : a >= 1e4 ? `${Math.round(n / 1e3)}k` : a >= 1e3 ? `${+(n / 1e3).toFixed(1)}k` : String(Math.round(n));
}
/* dollars: cents under $100, whole dollars above */
const money = v => v == null ? "" : `${v < 0 ? "-" : ""}$${Math.abs(v) >= 100 ? Math.round(Math.abs(v)).toLocaleString("en-US") : Math.abs(v).toFixed(2)}`;
const FMT = { usd: v => money(v), tok: v => tk(v), count: v => Math.round(v * 10) / 10 + "", pct: v => `${Math.round(v * 1000) / 10}%`, ms: v => dur(v), h: v => hrs(v), perf: v => `${+v.toFixed(2)} ms` };
const AXIS = { ...FMT, usd: v => v === 0 ? "$0" : Math.abs(v) >= 1000 ? `$${+(v / 1000).toFixed(1)}k` : `$${+v.toFixed(Math.abs(v) < 10 ? 2 : 0)}`, pct: v => `${Math.round(v * 100)}%`, ms: v => v === 0 ? "0" : v < 1000 ? `${Math.round(v)}ms` : v < 60000 ? `${+(v / 1000).toFixed(1)}s` : v < 3600000 ? `${+(v / 60000).toFixed(1)}m` : `${+(v / 3600000).toFixed(1)}h`, h: v => v === 0 ? "0" : v < 1 ? `${Math.round(v * 60)}m` : v < 48 ? `${+v.toFixed(1)}h` : `${+(v / 24).toFixed(1)}d` };

/* ---------- building blocks ---------- */
const icon = (name, cls = "") => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;

  const marks = s.marks || [], markAt = new Map();
  for (const e of marks) markAt.set(e.i, [...(markAt.get(e.i) || []), e]);
  for (const [i, es] of markAt) {  /* deploys as a dashed line, merges as a dot on the axis */
    if (es.some(e => e.kind === "deploy")) g += `<line class="mark" x1="${x(i)}" x2="${x(i)}" y1="${m.t}" y2="${m.t + ph}"/>`;
    if (es.some(e => e.kind === "merge")) g += `<circle class="mark-m" cx="${x(i)}" cy="${m.t + ph}" r="2.5"/>`;
  }
  marks.filter(e => e.kind === "annotation").forEach((e, k) => {  /* an annotation: a solid line where it happened in its hour or day, labeled */
    const ax = m.l + slot * (e.i + (e.f || 0)), right = ax > m.l + pw * .65, ty = m.t + 11 + (k % 3) * 13;
    g += `<line class="ann" x1="${ax}" x2="${ax}" y1="${m.t}" y2="${m.t + ph}"/><text class="ann-t" x="${right ? ax - 5 : ax + 5}" y="${ty}" text-anchor="${right ? "end" : "start"}">${esc(cut(e.label, 32))}</text>`;
  });
  const count = Math.max(2, Math.min(n, Math.floor(pw / 86)));
  const xl = [...new Set(Array.from({ length: count }, (_, k) => Math.round(k * (n - 1) / (count - 1))))];
  for (const i of xl) g += `<text x="${x(i)}" y="${H - 5}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}">${esc(xlab(labels[i]))}</text>`;
  g += bars.length ? `<rect class="colband cursor-el" x="0" y="${m.t}" width="${slot}" height="${ph}" visibility="hidden"/>` : `<line class="cursor cursor-el" x1="0" x2="0" y1="${m.t}" y2="${m.t + ph}" visibility="hidden"/>`;
  g += `<rect class="hit" x="${m.l}" y="${m.t}" width="${pw}" height="${ph}" fill="transparent"/>`;
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(s.label || "Chart")}">${g}</svg>`;

  const svg = el.firstChild, cursor = svg.querySelector(".cursor-el"), hit = svg.querySelector(".hit");
  const row = (color, label, value, ln) => `<div class="tr"><i class="sw${ln ? " ln" : ""}" style="background:${color}"></i><span>${esc(label)}</span><b>${esc(value)}</b></div>`;
  const show = ev => {
    const r = svg.getBoundingClientRect();
    const i = Math.min(n - 1, Math.max(0, Math.floor((ev.clientX - r.left - m.l) / slot)));
    if (bars.length) cursor.setAttribute("x", x(i) - slot / 2);
    else { cursor.setAttribute("x1", x(i)); cursor.setAttribute("x2", x(i)); }
    cursor.setAttribute("visibility", "visible");
    let html = `<div class="th">${esc(s.tipLabel ? s.tipLabel(i) : xlab(labels[i]))}</div>`;
    if (i < s.days.length) {
      for (const b of [...bars].reverse()) html += row(b.color, b.label, fmt(b.values[i] || 0));
      for (const l of lines) html += row(l.color, l.label, l.values[i] == null ? "no data" : fmt(l.values[i]), true);
    }
    const here = [...(markAt.get(i) || [])].sort((a, b) => (b.kind === "annotation") - (a.kind === "annotation"));  /* annotations first: someone chose to mark them */
    for (const e of here.slice(0, 4)) html += `<div class="tr ev"><i class="sw ${e.kind === "deploy" ? "ln dash" : e.kind === "annotation" ? "ann" : "dot"}"></i><span>${esc(e.label)}${e.kind === "annotation" ? ` <span class="dim">${esc(full(e.at))}</span>` : ""}</span></div>`;
    if ((markAt.get(i) || []).length > 4) html += `<div class="tr ev"><span class="dim">and ${markAt.get(i).length - 4} more</span></div>`;
    if (s.band && i >= s.band.from && i < s.band.from + s.band.p50.length) {
      const j = i - s.band.from;
      html += row("var(--ink-2)", "Forecast", fmt(s.band.p50[j]), true) + row("var(--band)", "Likely range", `${fmt(s.band.p10[j])} to ${fmt(s.band.p90[j])}`);
    }
    placeTip(html, ev.clientX, ev.clientY);
  };
  const hide = () => { cursor.setAttribute("visibility", "hidden"); tip.hidden = true; if (s.sync) for (const o of SYNCED) if (o !== el && o._off) o._off(); };
  if (s.sync) {
    for (const o of [...SYNCED]) if (!o.isConnected) SYNCED.delete(o);
    SYNCED.add(el);
    el._at = i => { if (bars.length) cursor.setAttribute("x", x(i) - slot / 2); else { cursor.setAttribute("x1", x(i)); cursor.setAttribute("x2", x(i)); } cursor.setAttribute("visibility", "visible"); };
    el._off = () => cursor.setAttribute("visibility", "hidden");
    hit.addEventListener("pointermove", ev => {
      const r = svg.getBoundingClientRect(), i = Math.min(n - 1, Math.max(0, Math.floor((ev.clientX - r.left - m.l) / slot)));
      for (const o of SYNCED) if (o !== el && o._at && o._spec.sync === s.sync && o._spec.days.length === s.days.length) o._at(i);
    });
  }
  hit.addEventListener("pointermove", show); hit.addEventListener("pointerdown", show); hit.addEventListener("pointerleave", hide);
}
function placeTip(html, cx, cy) {
  tip.innerHTML = html; tip.hidden = false;
  const tx = Math.min(window.innerWidth - tip.offsetWidth - 8, cx + 14);
  tip.style.left = Math.max(8, tx) + "px";
  tip.style.top = (cy - tip.offsetHeight - 12 < 8 ? cy + 18 : cy - tip.offsetHeight - 12) + "px";
}
/* every [data-tip] gets the same tooltip, on hover, focus or tap */
let tipFor = null;
function tipOn(el) {
  if (!el || el.closest(".chart")) return;
  tipFor = el;
  const r = el.getBoundingClientRect();
  tip.innerHTML = esc(el.dataset.tip); tip.hidden = false;
  const left = Math.min(window.innerWidth - tip.offsetWidth - 8, Math.max(8, r.left + r.width / 2 - tip.offsetWidth / 2));
  const above = r.top - tip.offsetHeight - 6;
  tip.style.left = left + "px"; tip.style.top = (above < 8 ? r.bottom + 6 : above) + "px";
}
function tipOff() { tipFor = null; tip.hidden = true; }
document.addEventListener("pointerover", ev => { const el = ev.target.closest("[data-tip]"); if (el && el !== tipFor) tipOn(el); else if (!el && tipFor) tipOff(); });
document.addEventListener("focusin", ev => { const el = ev.target.closest("[data-tip]"); if (el) tipOn(el); });
document.addEventListener("focusout", () => { if (tipFor) tipOff(); });
window.addEventListener("scroll", () => { if (tipFor) tipOff(); }, { passive: true });

/* ---------- gate decision (overview + run page) ---------- */
function gate(t) {
  if (!t) return `<div class="gate"><span>${tag("unknown", "No runs yet", true)}</span><div class="muted">Record one with <code>greenlight run -- pytest</code>.</div></div>`;
  const ids = list => `<ul class="ids">${list.slice(0, 5).map(id => `<li><a href="${testHref(id)}">${esc(id)}</a></li>`).join("")}${list.length > 5 ? `<li class="muted">and ${list.length - 5} more</li>` : ""}</ul>`;
  let head, body = "";
  if (t.decision === "REAL_FAILURE") {
    head = `${plural(t.blocking.length, "test")} ${t.blocking.length === 1 ? "blocks" : "block"} this commit`;
    body = ids(t.blocking);
  } else if (t.decision === "RERUN_TARGETED") {
    head = `Rerun ${plural(t.rerun_tests.length, "flaky test")}, not the suite`;
    body = ids(t.rerun_tests);
  } else {
    const q = t.failures.length;
    head = q ? `${plural(q, "quarantined failure")} ignored` : "Every test passed";
    if (t.passed_on_retry.length) body = `<div class="muted">${plural(t.passed_on_retry.length, "test")} passed only on retry.</div>`;
  }
  const r = t.run;
  return `<div class="gate"><span>${tag(t.decision, DECISION[t.decision], true)}</span><div class="head">${esc(head)}</div>${body}
    <div class="kv"><span>Commit ${sha(r.commit_sha)}</span><span>Attempt <b>${r.attempt}</b></span>${r.branch ? `<span>Branch <b>${esc(r.branch)}</b></span>` : ""}<span>${when(r.started_at)}</span></div></div>`;
}

/* ---------- views ---------- */
const SEV = { high: ["failing", "High"], medium: ["flaky", "Medium"], low: ["neutral", "Low"] };
function nextSteps(ins) {
  if (!ins || !ins.insights.length) return "";
  const cols = [
    { h: "", cell: i => tag(...SEV[i.severity]), sort: i => ["high", "medium", "low"].indexOf(i.severity), dir: 1, cls: "fit" },
    { h: "What", cell: i => `${esc(i.title)}<div class="sub">${esc(i.detail)}</div>`, cls: "wrap" },
    { h: "At stake", cell: i => i.stake ? tk(i.stake) : "", sort: i => i.stake || 0, cls: "num hide-sm", tip: "Cost in input tokens: what it cost, or what changing it would have saved" },
  ];
  return `<div class="grid">${panel({ title: "What to do next", tip: "From the test history and Claude's sessions, most at stake first. Open one for the evidence.", flush: true,
    actions: `<a class="lnk" href="${esc(panelHref("brief:session"))}">What Claude starts with</a>`,
    body: table("t-next", cols, ins.insights, { limit: 5, panel: i => i.action.panel || null, href: i => i.action.href || null }) })}</div>`;
}
PANELS.brief = async kind => {
  const d = await api("/api/insights", { days: DAYS });
  return {
    title: "What Claude starts with", sub: "The brief greenlight adds when a session connects",
    body: (d.brief ? `<pre class="brief">${esc(d.brief)}</pre>` : `<p class="empty">Nothing to say yet: no failures on the default branch, no flaky tests, no costly habits.</p>`)
      + `<p class="advice">A session gets this in the greenlight server's instructions when it connects, with no tool call. Subagents get a shorter one from the SubagentStart hook that <code>greenlight setup --project</code> adds, and <code>greenlight brief</code> prints it for scripts and workflows.</p>`,
  };
};

async function overviewView(tok) {
  const [d, ins] = await Promise.all([api("/api/overview", { days: DAYS }), api("/api/insights", { days: DAYS }).catch(() => null)]);
  if (tok !== renderToken) return;
  setSynced(d.synced);
  const t = d.totals, f = d.field;
  const share = d.days.map((_, i) => { const all = d.runs_first[i] + d.runs_rerun[i]; return all ? d.runs_rerun[i] / all : null; });
  const field = f.tests.length ? `<div class="hm">${f.tests.map(r => `<a class="hmr" href="${esc(panelHref(`test:${r.test_id}`))}"><span class="n" data-tip="${esc(r.test_id)}">${esc(splitId(r.test_id)[1])}${r.quarantined ? ' <span class="q">quarantined</span>' : ""}</span>${cells(r.cells, f.commits)}</a>`).join("")}
      <div class="hmx"><span></span><span><span>${f.commits.length ? esc(ago(f.commits[0].first_at)) : ""}</span><span>Latest commit</span></span></div></div>`
    : `<p class="empty">No test failed in the last ${DAYS} days.</p>`;
  view.innerHTML = `
    <div class="grid">
      ${panel({ cls: "s6", title: "Latest gate decision", tip: "What the gate decided for the newest run: block on a real failure, rerun only known flaky tests, or pass.", actions: d.latest ? `<a class="lnk" href="#/run/${d.latest.run.run_id}">Open run</a>` : "", body: gate(d.latest) })}
      <div class="s6 tiles">
        ${stat({ k: "Rerun share", v: t.runs ? pct(t.reruns / t.runs) : "0%", s: `${t.reruns} of ${plural(t.runs, "run")}`, tip: "Runs that were a second or later attempt on the same code.", spark: share, color: "var(--flip)" })}
        ${stat({ k: "Time rerunning", v: dur(t.rerun_ms), s: "test time on reruns", tip: "Test time spent on second and later attempts." })}
        ${stat({ k: "Flaky tests", v: t.flaky, s: `${t.suspect} suspect, ${t.failing} failing`, href: "#/flaky" })}
        ${stat({ k: "Quarantined", v: t.quarantined, s: "ignored by the gate", href: "#/quarantine" })}
      </div>
    </div>
    ${ins && ins.changes && ins.changes.length ? `<div class="grid">${changeCard(ins.changes)}${nextCards(ins)}</div>` : nextSteps(ins)}
    <div class="grid">
      ${panel({ cls: "s6", title: "Runs per day", tip: "Reruns are second and later attempts on the same code.", body: `<div class="chart" id="c-runs"></div>`, foot: legend([["var(--neutral)", "First attempt"], ["var(--flip)", "Rerun"]]) })}
      ${panel({ cls: "s6", title: "Failure rate", tip: "Share of test executions that failed, per day.", body: `<div class="chart" id="c-fail"></div>` })}
    </div>
    <div class="grid">
      ${panel({ title: "Unstable tests by commit", tip: "One column per commit, oldest on the left. A test is flaky when one commit both passed and failed it.", actions: `<span class="dim">${plural(f.commits.length, "commit")}</span>`, body: field, foot: f.tests.length ? fieldLegend() : "" })}
    </div>`;
  CHANGES = ins && ins.changes; drawChange(CHANGES);
  chart(document.getElementById("c-runs"), { days: d.days, label: "Runs per day", bars: [{ values: d.runs_first, color: "var(--neutral)", label: "First attempt" }, { values: d.runs_rerun, color: "var(--flip)", label: "Rerun" }] });
  chart(document.getElementById("c-fail"), { days: d.days, label: "Failure rate", format: "pct", lines: [{ values: d.failure_rate, color: "var(--fail)", label: "Failure rate", area: true }] });
}

async function flakyView(tok) {
  const d = await api("/api/flaky", { days: DAYS });
  if (tok !== renderToken) return;
  const cols = [
    { h: "Test", cell: r => testCell(r.test_id, `<div class="tags show-sm" style="margin-top:4px">${tag(r.classification)}${r.quarantined ? tag("quarantined") : ""}</div>`), sort: r => r.test_id, dir: 1, cls: "wrap" },
    { h: "Status", cell: r => `<span class="tags">${tag(r.classification)}${r.quarantined ? tag("quarantined") : ""}</span>`, sort: r => r.classification, dir: 1, cls: "hide-sm" },
    { h: "Flipped", cell: r => `${r.flip_shas}<span class="dim"> / ${r.eligible_shas}</span>`, sort: r => r.flip_shas, cls: "num", tip: "Commits it both passed and failed on, out of the commits it ran on more than once" },
    { h: "Confidence", cell: r => score(r.flake_score), sort: r => r.flake_score, cls: "num", tip: "Flipping on 5 of 10 commits ranks above 1 of 1" },
    { h: "Fail rate", cell: r => pct(r.executions ? r.failures / r.executions : null), sort: r => r.executions ? r.failures / r.executions : null, cls: "num hide-sm" },
    { h: "Last flip", cell: r => when(r.last_flip_at), sort: r => r.last_flip_at, cls: "num hide-sm" },
    { h: "Last 30 runs", cell: r => strip(r.recent), cls: "hide-sm" },
  ];
  const st = filterVal("status"), nq = d.tests.filter(r => r.quarantined).length;
  const by = countBy(d.tests.filter(r => !r.quarantined), r => r.classification);
  const CLS = { flaky: "Flaky", known_flaky: "Flaky", suspect: "Suspect", suspect_flaky: "Suspect", failing: "Failing", stable: "Stable" };
  const tone = { flip: "var(--flip)", "flip-o": "var(--flip)", fail: "var(--fail)", pass: "var(--pass)" };
  const rows = d.tests.filter(r => !st || (st === "quarantined" ? r.quarantined : r.classification === st && !r.quarantined));
  const chips = chipBar("status", [...[...by].map(([v, n]) => [v, CLS[v] || v.replace(/_/g, " "), n, tone[ST[v]] || "var(--neutral)"]),
    ...(nq ? [["quarantined", "Quarantined", nq, "var(--quar)"]] : [])], "All tests", d.tests.length);
  view.innerHTML = `<div class="fbar">${chips}</div><div class="grid">${panel({ title: "Flaky tests", tip: `Tests that passed and failed on the same code in the last ${DAYS} days.`, flush: true,
    actions: `<input type="search" class="inp" id="q" placeholder="Filter tests" aria-label="Filter tests"><span class="dim" id="count"></span>`,
    body: table("t-flaky", cols, rows, { sort: 3, limit: 20, panel: r => `test:${r.test_id}`, empty: d.tests.length ? "No test matches." : `No test flipped in the last ${DAYS} days. Flips need a commit tested more than once.` }) })}</div>`;
  const q = document.getElementById("q");
  const draw = () => {
    const term = q.value.trim().toLowerCase();
    TABLES["t-flaky"].rows = rows.filter(r => !term || r.test_id.toLowerCase().includes(term));
    document.getElementById("t-flaky").innerHTML = tableInner("t-flaky");
    document.getElementById("count").textContent = plural(TABLES["t-flaky"].rows.length, "test");
  };
  q.addEventListener("input", draw);
  document.getElementById("count").textContent = plural(rows.length, "test");
}

/* A test that measures something (a perf check's median against its base build) gets its numbers charted per run */

  chart(el, { days: pts.map(p => p.started_at), label: "Measured value per run", format: "perf",
    xfmt: v => fmtDay(String(v).slice(0, 10)), tipLabel: i => `${new Date(pts[i].started_at).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}, ${String(pts[i].sha || "").slice(0, 8)}`,
    lines: [{ values: pts.map(p => p.value_ms ?? null), color: "var(--series)", label: "This build", dots: true },
            ...(m.names.includes("base_ms") ? [{ values: pts.map(p => p.base_ms ?? null), color: "var(--ink-3)", label: "Base build", dots: true }] : [])] });
}

    </div>`;
  const el = document.getElementById("c-dur");
  chart(el, { days: d.durations.days, label: "Daily median duration", format: "ms", lines: [{ values: d.durations.values, color: "var(--series)", label: "Median", area: true }] });
  if (perf) drawPerf(m);
  const qf = document.getElementById("qf");
  if (qf) qf.addEventListener("submit", async ev => {
    ev.preventDefault();
    try { await post("/api/quarantine", { test_id: d.test_id, reason: document.getElementById("reason").value }); toast(`Quarantined ${name}`); render(); }
    catch (e) { toast(e.message); }
  });
  try {
    const f = await api("/api/test/forecast", { id: d.test_id });
    if (tok !== renderToken) return;
    const hold = f.backtest.p50.length;
    chart(el, { days: f.days, future: f.future_days, format: "ms", label: "Duration with forecast",
      lines: [{ values: f.values, color: "var(--series)", label: "Median" }],
      band: { from: f.days.length - hold, p10: f.backtest.p10.concat(f.future.p10), p50: f.backtest.p50.concat(f.future.p50), p90: f.backtest.p90.concat(f.future.p90) } });
    document.getElementById("dur-foot").innerHTML = legend([["var(--series)", "Daily median", true], ["var(--ink-2)", "Forecast", true], ["var(--band)", "Likely range"]]) + `<div class="dim" style="margin-top:4px">The first ${hold} forecast days are predicted from the days before them. A line above the range means it got slower.</div>`;
  } catch (e) {
    if (tok !== renderToken) return;
    if (e.status !== 501 && !(SNAP && e.status === 404)) document.getElementById("dur-foot").insertAdjacentHTML("beforeend", `<div class="dim" style="margin-top:4px">No forecast: ${esc(e.message)}</div>`);
  }
}

    { k: "branch", label: "Branch", options: optionsOf(d.runs, r => r.branch) },
    { k: "conv", label: "Conversation", options: optionsOf(d.runs, r => r.conversation && r.conversation.session_id, r => convName(r.conversation)),
      extra: d.runs.some(r => !r.conversation) && d.runs.some(r => r.conversation) ? [["none", "None recorded"]] : [] },

const WHY = {
  quarantined: () => "Quarantined, so the gate ignores it.",
  known_flaky: f => `Flipped on ${f.flip_shas} of ${plural(f.eligible_shas, "commit")}. Rerun this test only.`,
  suspect_flaky: f => `Flipped on ${plural(f.flip_shas, "commit")} before. Rerun this test only.`,
  new_test: () => "First run of this test, so no history to call it flaky. Blocks.",
  real_failure: f => f.flip_shas ? `Has flaked before, but failed ${plural(f.this_sha.fails, "time")} on this commit without passing. Treated as real.` : "No flake history. Blocks.",
};
async function runView(tok, id) {
  const t = await api("/api/run", { id });
  if (tok !== renderToken) return;
  setCrumbs([["Tests"], ["Runs", "#/runs"]], `Run ${t.run.run_id}`);
  const order = { real_failure: 0, new_test: 1, known_flaky: 2, suspect_flaky: 3, quarantined: 4 };
  const fails = [...t.failures].sort((a, b) => order[a.category] - order[b.category]);
  const r = t.run;
  const meta = [
    r.source ? `<span>Source <b>${esc(r.source)}</b></span>` : "",
    r.git_commit && r.git_commit !== r.commit_sha ? `<span>Git commit <code>${esc(r.git_commit.slice(0, 8))}</code></span>` : "",
    r.command ? `<span><code>${esc(r.command)}</code></span>` : "",
    r.session ? (isUrl(r.url) ? `<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.session)}</a>` : `<span>${esc(r.session)}</span>`) : isUrl(r.url) ? `<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Open the run</a>` : "",
  ].join("");
  const partial = r.results_named < r.tests ? `Only the checks that failed or ran slower are named; ${plural(r.tests - r.results_named, "other check")} not listed.` : "";
  const cols = [
    { h: "Verdict", cell: f => `${tag(f.category)}${f.new_signature ? `<div style="margin-top:4px">${tag("failing", "new message")}</div>` : ""}`, sort: f => order[f.category], dir: 1, cls: "fit" },
    { h: "Test", cell: f => `${testCell(f.test_id)}<div class="why">${esc(WHY[f.category](f))}</div>${f.message ? `<div class="msg">${esc(f.message)}</div>` : ""}`, sort: f => f.test_id, dir: 1, cls: "wrap" },
    { h: "Flipped", cell: f => `${f.flip_shas}<span class="dim"> / ${f.eligible_shas}</span>`, sort: f => f.flip_shas, cls: "num fit hide-sm" },
  ];
  view.innerHTML = `
    <div class="grid">
      ${panel({ cls: "s12", title: "Gate decision", body: gate(t) + (meta ? `<div class="kv" style="margin-top:6px">${meta}</div>` : "") })}
    </div>
    <div class="grid">
      ${panel({ title: t.failures.length ? "Failing tests" : "No failing tests", tip: `${plural(r.tests, "test")} ran. Blocking failures come first.`, flush: true, actions: `<span class="dim">${t.failures.length} of ${r.tests}</span>`,
        body: t.failures.length ? table("t-fails", cols, fails, { sort: 0, dir: 1, limit: 20 }) : `<p class="empty">Every test passed on the final attempt.</p>`, foot: partial })}
    </div>
    ${t.passed_on_retry.length ? `<div class="grid">${panel({ title: "Passed only on retry", tip: "Failed at least once in this run, then passed. Counts toward flake history, doesn't block.", body: `<ul class="ids">${t.passed_on_retry.map(id => `<li><a href="${testHref(id)}">${esc(id)}</a></li>`).join("")}</ul>` })}</div>` : ""}`;
}

const SUITE = [["reruns", "Reruns", "count"], ["failure_rate", "Failure rate", "pct"], ["suite_duration_ms", "Suite duration", "ms"], ["runs", "All runs", "count"]];
let suiteMetric = "reruns";
async function trendsView(tok) {
  view.innerHTML = skeleton() + `<p class="dim" style="margin:10px 2px">Running forecasts. The first load downloads the model.</p>`;
  let reg;
  try { reg = await api("/api/trends/durations"); }

  if (tok !== renderToken) return;
  view.innerHTML = `
    <div class="grid">
      ${panel({ title: "Suite forecast", tip: `Last 60 days and the next 7 from Toto (${reg.model}), running locally. Reruns should trend down if the gate is working.`,
        actions: `<div class="seg" id="metric" role="group" aria-label="Metric">${SUITE.map(([k, l]) => `<button type="button" data-m="${k}" aria-pressed="${k === suiteMetric}">${l}</button>`).join("")}</div>`,
        body: `<div class="chart" id="c-suite"></div>`, foot: `<div id="suite-note"></div>` })}
    </div>
    <div class="row-title">${icon("trends")}Getting slower <span class="dim" style="font-weight:400">${plural(reg.regressions.length, "test")} of ${reg.tests_checked} checked</span>${info(`Each test's last ${plural(reg.holdout_days, "day")} against what Toto predicted from its history. Flagged when a day lands above the likely range and at least 20% over the expected value. Slowdowns often show up before timeout flakes.`)}</div>
    <div class="grid" id="regs">${reg.regressions.length ? "" : `<div class="panel s12"><p class="empty">Nothing ran slower than forecast in the last ${plural(reg.holdout_days, "day")}.</p></div>`}</div>`;
  const regs = document.getElementById("regs");
  reg.regressions.forEach((r, i) => {
    const worst = r.breaches.reduce((a, b) => b.pct_over_expected > a.pct_over_expected ? b : a);
    regs.insertAdjacentHTML("beforeend", panel({ cls: "s6", title: splitId(r.series)[1], actions: `<a class="lnk" href="${testHref(r.series)}">Open</a>`,
      body: `<div class="chart" id="c-reg-${i}"></div>`, foot: `${tag("failing", `${Math.round(worst.pct_over_expected)}% over`)} <span class="muted">${esc(fmtDay(worst.day))}: ${dur(worst.actual)}, expected ${dur(worst.expected_p50)}</span>` }));
    chart(document.getElementById(`c-reg-${i}`), { days: r.days, height: 130, format: "ms", label: `Duration of ${r.series}`,
      lines: [{ values: r.values, color: "var(--series)", label: "Median" }],
      band: { from: r.days.length - r.forecast.p50.length, ...r.forecast } });
  });
  const drawSuite = async () => {
    const el = document.getElementById("c-suite"), note = document.getElementById("suite-note");
    const [key, label, fmt] = SUITE.find(s => s[0] === suiteMetric);
    const color = key === "failure_rate" ? "var(--fail)" : "var(--series)";
    document.querySelectorAll("#metric button").forEach(b => b.setAttribute("aria-pressed", b.dataset.m === key));
    try {
      const f = await api("/api/trends/suite", { metric: key });
      if (tok !== renderToken) return;
      chart(el, { days: f.recent.map(r => r.day), future: f.forecast.map(r => r.day), format: fmt, label, height: 220,
        lines: [{ values: f.recent.map(r => r.value), color, label, area: true }],
        band: { from: f.recent.length, p10: f.forecast.map(r => r.p10), p50: f.forecast.map(r => r.p50), p90: f.forecast.map(r => r.p90) } });
      const a = f.recent_anomaly;
      note.innerHTML = legend([[color, label, true], ["var(--ink-2)", "Forecast", true], ["var(--band)", "Likely range"]]) +
        (a ? `<div style="margin-top:6px">${tag("failing", "Above forecast")} <span class="muted">${a.map(b => `${esc(fmtDay(b.day))}: ${esc(FMT[fmt](b.actual))}, expected ${esc(FMT[fmt](b.expected_p50))}`).join("; ")}</span></div>` : "");
    } catch (e) {
      if (tok !== renderToken) return;
      if (e.status === 501) { view.innerHTML = errorBox(e); return; }  /* no Toto: one message, not half a page */
      el.innerHTML = ""; note.innerHTML = errorBox(e);
    }
  };
  document.getElementById("metric").addEventListener("click", ev => { const b = ev.target.closest("button"); if (b) { suiteMetric = b.dataset.m; drawSuite(); } });
  drawSuite();
}

function waterfall(jobs) {
  const span = Math.max(1, ...jobs.map(j => (j.offset_ms || 0) + (j.duration_ms || 0)));
  const ticks = timeTicks(span), top = ticks[ticks.length - 1] || span, step = ticks[1] - ticks[0];
  const at = v => `${(100 * Math.max(0, v) / top).toFixed(3)}%`;
  const grid = `background-size:${(100 * step / top).toFixed(3)}% 100%`;
  const bar = (off, d, st, label, thin) => `<i class="bar st-${ST[st] || "neutral"}${thin ? " thin" : ""}" style="left:${at(off)};width:${at(d)}" data-tip="${esc(label)}"></i>`;
  const rows = jobs.map(j => {
    const steps = j.steps || [], start = Date.parse(j.started_at);
    const label = `${j.name}: ${STATUS_LABEL[j.status] || j.status}, ${dur(j.duration_ms)}${j.queue_ms != null ? `, waited ${dur(j.queue_ms)} for a runner` : ""}`;
    const head = `<span class="wn">${steps.length ? icon("right") : `<span style="width:12px;flex:none"></span>`}${esc(j.name)}</span><span class="track" style="${grid}">${bar(j.offset_ms || 0, j.duration_ms || 0, j.status, label)}</span><span class="num">${dur(j.duration_ms)}</span>`;
    if (!steps.length) return `<div class="wr">${head}</div>`;
    const sub = steps.map(s => {
      const off = (j.offset_ms || 0) + (s.started_at && !isNaN(start) ? Date.parse(s.started_at) - start : 0);
      return `<div class="wr sub"><span class="wn">${esc(s.name)}</span><span class="track" style="${grid}">${bar(off, s.duration_ms || 0, s.status, `${s.name}: ${STATUS_LABEL[s.status] || s.status}, ${dur(s.duration_ms)}`, true)}</span><span class="num">${dur(s.duration_ms)}</span></div>`;
    }).join("");
    return `<details class="wj"><summary class="wr">${head}</summary>${sub}</details>`;
  }).join("");
  return `<div class="wf"><div class="wr wax"><span>Job</span><span class="track">${ticks.map(t => `<b style="left:${at(t)}">${esc(AXIS.ms(t))}</b>`).join("")}</span><span></span></div>${rows}</div>`;
}
