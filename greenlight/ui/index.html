<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>greenlight</title>
<script>try { if (localStorage.getItem("greenlight-theme") === "light") document.documentElement.dataset.theme = "light"; } catch { /* storage unavailable */ }</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Dark is the default; the toggle stores "light". Status colors are validated for color vision deficiency on each
   theme's panel surface: pass, flip, fail and quarantined, all pairs. */
:root {
  color-scheme: dark;
  --bg: #0b0d12; --panel: #12151c; --panel-2: #181c25; --sunk: #0e1117;
  --line: #262b36; --line-2: #1c2029;
  --ink: #e3e6ed; --ink-2: #a0a7b4; --ink-3: #737a89;
  --accent: #9d87ff; --accent-ink: #0b0d12; --wash: rgba(157, 135, 255, .14);
  --pass: #00aa82; --flip: #c08000; --fail: #c2272d; --quar: #6d78d8;
  --series: #9d87ff; --neutral: #4b5366;
  --band: rgba(160, 167, 180, .17);
  --tip-bg: #1e232d; --shadow: 0 10px 28px rgba(0, 0, 0, .5);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f2f3f6; --panel: #ffffff; --panel-2: #f6f7f9; --sunk: #f2f3f6;
  --line: #dde0e6; --line-2: #eceef2;
  --ink: #161a22; --ink-2: #545c6a; --ink-3: #7c8391;
  --accent: #6b4fdb; --accent-ink: #ffffff; --wash: rgba(107, 79, 219, .10);
  --pass: #10916d; --flip: #b06a00; --fail: #b8173f; --quar: #5a63c8;
  --series: #6b4fdb; --neutral: #b3b9c5;
  --band: rgba(84, 92, 106, .13);
  --tip-bg: #ffffff; --shadow: 0 10px 28px rgba(22, 26, 34, .14);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 13px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-feature-settings: "cv11", "ss01";
}
code, .mono { font-family: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace; font-size: .92em; }
a { color: inherit; text-decoration: none; }
a:hover { color: var(--ink); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 3px; }
[hidden] { display: none !important; }
.muted { color: var(--ink-2); }
.dim { color: var(--ink-3); }
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

/* Shell: sidebar, top bar, content */
.app { display: grid; grid-template-columns: 212px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; z-index: 40; }
.brand { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; border-bottom: 1px solid var(--line); font-weight: 650; font-size: 14px; letter-spacing: -.01em; flex: none; }
.brand svg { width: 20px; height: 20px; }
.nav { display: flex; flex-direction: column; gap: 1px; padding: 6px 8px 12px; }
.nav .grp { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 12px 8px 4px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 4px; color: var(--ink-2); }
.nav a:hover { background: var(--panel-2); color: var(--ink); }
.nav a[aria-current] { background: var(--wash); color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); }
.side-foot { margin-top: auto; padding: 10px 16px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; min-height: 42px; }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--pass); flex: none; }
.pulse.off { background: var(--ink-3); }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; color: var(--ink-3); }
.crumbs a:hover { color: var(--ink); }
.crumbs .ic { width: 12px; height: 12px; }
.crumbs h1 { margin: 0; font-size: 14px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.crumbs > span { white-space: nowrap; }
.tb { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); color: var(--ink-2); cursor: pointer; white-space: nowrap; font-size: 12.5px; }
.tb:hover { color: var(--ink); border-color: var(--ink-3); }
.tb.icon { width: 30px; padding: 0; justify-content: center; }
.tb[aria-disabled="true"] { opacity: .5; cursor: default; }
.tb[aria-disabled="true"]:hover { color: var(--ink-2); border-color: var(--line); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--wash); color: var(--ink); font-size: 12px; white-space: nowrap; }
.picker { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); min-width: 180px; padding: 4px; background: var(--tip-bg); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); z-index: 50; }
.menu button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border: 0; border-radius: 4px; background: none; text-align: left; cursor: pointer; color: var(--ink); }
.menu button:hover { background: var(--panel-2); }
.menu button .ic { visibility: hidden; color: var(--accent); stroke-width: 2.2; }
.menu button[aria-checked="true"] { font-weight: 600; }
.menu button[aria-checked="true"] .ic { visibility: visible; }
#menu-btn { display: none; }
.scrim { display: none; }
#view { padding: 12px 16px 48px; min-width: 0; }
#view:focus { outline: none; }
#view.busy { opacity: .6; transition: opacity .15s .15s; }
#bar { position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 60; overflow: hidden; pointer-events: none; }
#bar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { left: -30%; } to { left: 100%; } }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; top: 0; bottom: 0; left: 0; width: 240px; height: auto; transform: translateX(-100%); transition: transform .18s ease; padding-top: env(safe-area-inset-top, 0px); }
  body.nav-open .side { transform: none; box-shadow: var(--shadow); }
  body.nav-open .scrim { display: block; position: fixed; inset: 0; z-index: 35; background: rgba(0, 0, 0, .45); }
  #menu-btn { display: inline-flex; }
  .top { top: env(safe-area-inset-top, 0px); padding: 0 12px; }
  #view { padding: 10px 12px 40px; }
}
@media (max-width: 560px) {
  .crumbs > span, .crumbs > a, .crumbs > .ic { display: none; }
  #range-label { display: none; }
}

/* Panels: a 12 column grid, 8px gutters */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 8px; }
.grid + .grid, .grid + .row-title, .row-title + .grid, .vars + .grid { margin-top: 8px; }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; }
.s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
@media (max-width: 1100px) { .s3 { grid-column: span 6; } .s5, .s7 { grid-column: span 12; } }
@media (max-width: 900px) { .s4.panel:not(.stat), .s6, .s8 { grid-column: span 12; } }
@media (max-width: 560px) { .s4:not(.stat) { grid-column: span 12; } }
.start { align-self: start; }
.panel { position: relative; display: flex; flex-direction: column; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
a.panel:hover { border-color: var(--ink-3); }
.ph { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; min-height: 36px; padding: 6px 10px 4px 12px; }
.ph h2 { margin: 0; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pa { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }
.pb { flex: 1; min-width: 0; padding: 4px 12px 12px; }
.pb.flush { padding: 0; border-top: 1px solid var(--line-2); }
.pf { padding: 8px 12px; border-top: 1px solid var(--line-2); color: var(--ink-2); font-size: 12px; }
.info { display: inline-flex; padding: 0; border: 0; background: none; color: var(--ink-3); cursor: help; }
.info:hover, .info:focus-visible { color: var(--ink); }
.info .ic { width: 14px; height: 14px; }
.row-title { display: flex; align-items: center; gap: 8px; padding: 10px 2px 2px; font-size: 13px; font-weight: 600; }
.row-title .ic { color: var(--ink-3); }
.lnk { color: var(--accent); font-weight: 500; white-space: nowrap; }
.lnk:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.vars { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.var { display: inline-flex; align-items: stretch; height: 30px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--panel); }
.var span { display: flex; align-items: center; padding: 0 10px; background: var(--panel-2); color: var(--ink-2); border-right: 1px solid var(--line); font-size: 12px; }
.var select { border: 0; background: var(--panel); color: var(--ink); font: inherit; padding: 0 8px; min-width: 0; }

/* Stat tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.stat { padding: 10px 12px 12px; min-height: 96px; justify-content: space-between; gap: 6px; }
.stat .k { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 12px; font-weight: 500; }
.stat .vr { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; }
.stat .v { font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; white-space: nowrap; }
.stat .v small { font-size: 13px; font-weight: 500; color: var(--ink-2); margin-left: 3px; letter-spacing: 0; }
.stat .s { color: var(--ink-2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spark { flex: 0 1 48%; height: 30px; min-width: 0; display: block; overflow: visible; }
@media (max-width: 560px) {
  .stat { min-height: 84px; padding: 8px 10px 10px; }
  .stat .v { font-size: 21px; }
  .s4.stat .spark, .s4.stat .s { display: none; }
}

/* Status tags: shape and label carry the state, color backs them up */
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 0 7px 0 6px; border-radius: 3px; line-height: 20px; font-size: 12px; font-weight: 500; white-space: nowrap; color: var(--ink); background: color-mix(in srgb, var(--c) 16%, transparent); }
.tag i { width: 8px; height: 8px; flex: none; background: var(--c); }
.tag.lg { font-size: 13px; line-height: 24px; padding: 0 10px 0 8px; gap: 8px; }
.tag.lg i { width: 10px; height: 10px; }
.st-pass { --c: var(--pass); } .st-pass i { border-radius: 50%; }
.st-fail { --c: var(--fail); } .st-fail i { border-radius: 1px; }
.st-flip, .st-flip-o { --c: var(--flip); } .st-flip i, .st-flip-o i { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.st-flip-o i { opacity: .55; }
.st-quar { --c: var(--quar); } .st-quar i { transform: rotate(45deg) scale(.8); border-radius: 1px; }
.st-neutral { --c: var(--ink-3); } .st-neutral i { border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
.st-run { --c: var(--accent); } .st-run i { border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 2px var(--c); }
.tags { display: inline-flex; flex-wrap: wrap; gap: 4px; }

/* Tables */
.tw { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.t th { text-align: left; font-weight: 500; font-size: 11.5px; color: var(--ink-2); padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--panel-2); }
.t th[data-col] { cursor: pointer; user-select: none; }
.t th[data-col]:hover { color: var(--ink); }
.t th[aria-sort="ascending"]::after { content: " \2191"; color: var(--accent); }
.t th[aria-sort="descending"]::after { content: " \2193"; color: var(--accent); }
.t td { padding: 6px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; line-height: 20px; }
.t td .sub, .t td .why { line-height: 1.45; }
.t tr:last-child td { border-bottom: 0; }
.t th:first-child, .t td:first-child { padding-left: 12px; }
.t th:last-child, .t td:last-child { padding-right: 12px; }
.t tbody tr:hover td { background: var(--panel-2); }
.t tr[data-href] { cursor: pointer; }
.t .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.t .nw { white-space: nowrap; }
.t .wrap { min-width: 13rem; overflow-wrap: anywhere; }
.t .act { text-align: right; white-space: nowrap; }
.t .fit { width: 1%; white-space: nowrap; }
.show-sm { display: none !important; }
.t a.tl:hover { color: var(--accent); }
.t .sub { color: var(--ink-3); font-size: 11.5px; overflow-wrap: anywhere; }
.more { padding: 8px 12px; border-top: 1px solid var(--line-2); }
.empty { margin: 0; padding: 14px 12px; color: var(--ink-2); }
.pb > .empty { padding: 10px 0 4px; }
@media (max-width: 720px) {
  .t .hide-sm { display: none; }
  .t .show-sm { display: flex !important; }
  .t th, .t td { padding-left: 8px; padding-right: 8px; }
  .t .wrap { min-width: 9rem; }
}

/* Controls */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 500; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink-3); }
.btn.sm { height: 24px; padding: 0 9px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.inp { height: 28px; padding: 0 9px; border: 1px solid var(--line); border-radius: 4px; background: var(--sunk); color: var(--ink); font: inherit; min-width: 0; width: 200px; }
.inp:focus { outline: none; border-color: var(--accent); }
.chk { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); white-space: nowrap; cursor: pointer; }
.chk input { accent-color: var(--accent); margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { padding: 0 10px; height: 26px; border: 0; background: transparent; color: var(--ink-2); cursor: pointer; font-size: 12px; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--wash); color: var(--ink); font-weight: 500; }
.qform { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.qform .inp { width: 260px; }
@media (max-width: 720px) { .inp, .qform .inp { width: 100%; font-size: 16px; } .pa:has(input) { width: 100%; justify-content: flex-start; } .bar2 > .qform { width: 100%; } }

/* Gate */
.gate { display: flex; flex-direction: column; gap: 8px; }
.gate .head { font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
.ids { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.ids a { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-size: 12px; overflow-wrap: anywhere; }
.ids a:hover { color: var(--accent); }
.kv { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--ink-2); font-size: 12px; }
.kv b { color: var(--ink); font-weight: 500; }
.kv a { color: var(--accent); }

/* Entity header on detail pages */
.ent { padding: 12px; gap: 8px; }
.ent .cls { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; color: var(--ink-3); font-size: 12px; overflow-wrap: anywhere; }
.ent .name { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-size: 17px; font-weight: 500; overflow-wrap: anywhere; line-height: 1.3; }
.ent .title { font-size: 17px; font-weight: 600; }
.ent .bar2 { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }

/* Flake field and strips: bar height is the share of runs that failed; amber means pass and fail on one commit */
.hm { display: flex; flex-direction: column; gap: 1px; }
.hmr { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr); gap: 12px; align-items: end; padding: 3px 0; }
a.hmr:hover .n { color: var(--accent); }
.hmr .n { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hmr .n .q { color: var(--quar); }
.cells { display: flex; align-items: flex-end; gap: 2px; height: 22px; }
.cells i { flex: 1 1 0; min-width: 2px; height: 30%; background: var(--pass); border-radius: 2px 2px 0 0; }
.cells i.f { height: 100%; background: var(--fail); }
.cells i.x { height: 100%; background: var(--flip); }
.cells i.n { height: 2px; background: var(--line); border-radius: 0; }
.hmx { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr); gap: 12px; color: var(--ink-3); font-size: 11px; padding-top: 4px; }
.hmx > span:last-child { display: flex; justify-content: space-between; }
@media (max-width: 720px) { .hmr, .hmx { grid-template-columns: minmax(0, 1fr); gap: 3px; } .hmx > span:first-child { display: none; } }
.strip { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; vertical-align: middle; width: 150px; }
.strip i { flex: 1 1 0; min-width: 1px; max-width: 4px; height: 35%; background: var(--pass); border-radius: 1px 1px 0 0; }
.strip i.f { height: 100%; background: var(--fail); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--ink-2); font-size: 12px; }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex: none; }
.sw.ln { height: 2px; width: 14px; border-radius: 1px; }
.score { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
.score .track { width: 52px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.score b { display: block; height: 100%; background: var(--flip); border-radius: 2px; }

/* Charts */
.chart { width: 100%; min-height: 60px; }
.chart svg { display: block; overflow: visible; touch-action: pan-y; }
.chart .grid { stroke: var(--line-2); stroke-width: 1; }
.chart .axis { stroke: var(--line); stroke-width: 1; }
.chart text { fill: var(--ink-3); font-size: 11px; font-family: inherit; font-variant-numeric: tabular-nums; }
.chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .band { fill: var(--band); }
.chart .median { fill: none; stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 4 3; }
.chart .future { fill: var(--panel-2); }
.chart .cursor { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }
.chart .colband { fill: var(--ink); opacity: .06; }
#tip { position: fixed; z-index: 70; pointer-events: none; max-width: 300px; padding: 7px 10px; border-radius: 4px; border: 1px solid var(--line); background: var(--tip-bg); color: var(--ink); box-shadow: var(--shadow); font-size: 12px; line-height: 1.5; }
#tip .th { font-weight: 600; margin-bottom: 2px; }
#tip .tr { display: flex; align-items: center; gap: 8px; }
#tip .tr span { color: var(--ink-2); flex: 1; }
#tip .tr b { font-weight: 600; font-variant-numeric: tabular-nums; }
#tip .sw { width: 8px; height: 8px; }

/* Messages, run failures, pipeline waterfall */
.msg { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-size: 11.5px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--sunk); border: 1px solid var(--line-2); border-radius: 3px; padding: 6px 8px; margin: 6px 0 0; max-height: 9.5em; overflow: auto; color: var(--ink-2); }
.sigs { display: flex; flex-direction: column; }
.sig { padding: 10px 12px; border-bottom: 1px solid var(--line-2); }
.sig:last-child { border-bottom: 0; }
.why { color: var(--ink-2); font-size: 12px; margin-top: 2px; }
.wf { font-size: 12.5px; }
.wr { display: grid; grid-template-columns: minmax(0, 14rem) minmax(0, 1fr) 4.5rem; gap: 12px; align-items: center; padding: 5px 12px; border-bottom: 1px solid var(--line-2); }
.wr.wax { color: var(--ink-3); font-size: 11px; border-bottom: 1px solid var(--line); padding-top: 7px; padding-bottom: 7px; background: var(--panel-2); }
.wr .wn { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wr .wn .ic { width: 12px; height: 12px; color: var(--ink-3); transition: transform .12s; }
.wr .num { text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.track { position: relative; height: 16px; background-image: linear-gradient(to right, var(--line-2) 1px, transparent 1px); }
.wax .track { background: none; height: 14px; }
.wax .track b { position: absolute; top: 0; font-weight: 400; transform: translateX(-50%); white-space: nowrap; }
.wax .track b:first-child { transform: none; }
.wax .track b:last-child { transform: translateX(-100%); }
.bar { position: absolute; top: 2px; height: 12px; min-width: 3px; border-radius: 0 3px 3px 0; background: var(--c); }
.bar.thin { top: 5px; height: 6px; opacity: .85; }

.wr.sub .wn { padding-left: 18px; }
@media (max-width: 720px) { .wr { grid-template-columns: minmax(0, 1fr) 4rem; } .wr .track { grid-column: 1 / -1; order: 3; } .wr.wax span:first-child, .wr.wax span:last-child { display: none; } .wr.wax { grid-template-columns: minmax(0, 1fr); } }

.err { margin: 0; padding: 12px; border-left: 3px solid var(--fail); background: var(--panel); border-radius: 4px; }
.err p { margin: 0 0 6px; }
.err p:last-child { margin: 0; }
.skel { min-height: 96px; background: linear-gradient(90deg, var(--panel) 30%, var(--panel-2) 50%, var(--panel) 70%) 0 0 / 300% 100%; animation: shimmer 1.4s linear infinite; }
.skel.tall { min-height: 240px; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
@media (prefers-reduced-motion: reduce) { .skel, #bar::after { animation: none; } }
#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80; padding: 8px 14px; border-radius: 4px; border: 1px solid var(--line); background: var(--tip-bg); color: var(--ink); box-shadow: var(--shadow); opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100vw - 32px); }
#toast.show { opacity: 1; }

<script>
"use strict";
const SNAP = JSON.parse(document.getElementById("snapshot").textContent || "null");
const LIVE = !SNAP;
const NOW = SNAP ? new Date(SNAP.generated_at) : new Date();
const view = document.getElementById("view");
const RANGES = [7, 14, 30, 90];
let DAYS = SNAP ? SNAP.days : (() => { try { return Number(localStorage.getItem("greenlight-days")) || 30; } catch { return 30; } })();
let renderToken = 0;

/* ---------- data ---------- */
class ApiError extends Error { constructor(msg, status) { super(msg); this.status = status; } }
function snapKey(path, params) {
  return path + "?" + Object.keys(params).sort().map(k => `${k}=${params[k]}`).join("&");
}
/* relative URLs, so a page served under /<token>/ keeps the token on every call */
async function api(path, params = {}) {
  const p = Object.fromEntries(Object.entries(params).map(([k, v]) => [k, String(v)]));
  if (SNAP) {
    const r = SNAP.responses[snapKey(path, p)];
    if (!r) throw new ApiError("This view isn't in the snapshot. Open the live dashboard to see it.", 404);
    if (r.__status) throw new ApiError(r.error, r.__status);
    return r;
  }
  const qs = new URLSearchParams(p).toString();
  const res = await fetch(path.slice(1) + (qs ? "?" + qs : ""));
  let data = {};
  try { data = await res.json(); } catch { /* non-JSON error */ }
  if (!res.ok) throw new ApiError(data.error || `${res.status} ${res.statusText}`, res.status);
  return data;
}
async function post(path, body) {
  const res = await fetch(path.slice(1), { method: "POST", headers: { "Content-Type": "application/json", "X-Greenlight": "1" }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new ApiError(data.error || res.statusText, res.status);
  return data;
}

/* ---------- formatting ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
/* a code identity is "<sha>", "<sha>@<matrix entry>" or either plus "+<hash>" for uncommitted edits */
function sha(s) {
  const raw = String(s || ""), [base, edits] = raw.split("+"), [commit, env] = base.split("@");
  return `<code>${esc(commit.slice(0, 8))}</code>` + (env ? ` <span class="muted">on ${esc(env)}</span>` : "") + (edits ? ` <span class="muted">+ edits</span>` : "");
}
const plural = (n, word, many) => `${n} ${n === 1 ? word : (many || word + "s")}`;
const pct = x => x == null || isNaN(x) ? "n/a" : `${Math.round(x * 100)}%`;
const testHref = id => "#/test/" + encodeURIComponent(id);
const pipeHref = id => "#/pipeline/" + encodeURIComponent(id);
const splitId = id => { const i = id.lastIndexOf("::"); return i < 0 ? ["", id] : [id.slice(0, i), id.slice(i + 2)]; };
const isUrl = u => u && /^https:\/\//.test(u);
const full = iso => iso ? new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "";
function ago(iso) {
  if (!iso) return "never";
  const s = (NOW - new Date(iso)) / 1000;
  if (s < 90) return "just now";
  if (s < 3600) return `${Math.round(s / 60)}m ago`;
  if (s < 86400) return `${Math.round(s / 3600)}h ago`;
  if (s < 86400 * 45) return `${Math.round(s / 86400)}d ago`;
  return new Date(iso).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
}
const when = iso => `<span data-tip="${esc(full(iso))}">${esc(ago(iso))}</span>`;
function dur(ms) {
  if (ms == null) return "n/a";
  if (ms < 1000) return `${Math.round(ms)} ms`;
  const s = ms / 1000;
  if (s < 60) return `${s.toFixed(s < 10 ? 2 : 1)} s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ${Math.round(s % 60)}s`;
  return `${Math.floor(m / 60)}h ${m % 60}m`;
}
const fmtDay = d => new Date(String(d).slice(0, 10) + "T00:00:00Z").toLocaleDateString(undefined, { month: "short", day: "numeric", timeZone: "UTC" });
function hrs(h) {
  if (h == null) return "n/a";
  if (h < 1) return `${Math.max(1, Math.round(h * 60))} min`;
  if (h < 48) return `${+h.toFixed(h < 10 ? 1 : 0)} h`;
  return `${+(h / 24).toFixed(1)} days`;
}
const FMT = { count: v => Math.round(v * 10) / 10 + "", pct: v => `${Math.round(v * 1000) / 10}%`, ms: v => dur(v), h: v => hrs(v), perf: v => `${+v.toFixed(2)} ms` };
const AXIS = { ...FMT, pct: v => `${Math.round(v * 100)}%`, ms: v => v === 0 ? "0" : v < 1000 ? `${Math.round(v)}ms` : v < 60000 ? `${+(v / 1000).toFixed(1)}s` : v < 3600000 ? `${+(v / 60000).toFixed(1)}m` : `${+(v / 3600000).toFixed(1)}h`, h: v => v === 0 ? "0" : v < 1 ? `${Math.round(v * 60)}m` : v < 48 ? `${+v.toFixed(1)}h` : `${+(v / 24).toFixed(1)}d` };

/* ---------- building blocks ---------- */
const icon = (name, cls = "") => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const info = text => text ? `<button class="info" type="button" aria-label="${esc(text)}" data-tip="${esc(text)}">${icon("info")}</button>` : "";
function panel({ cls = "s12", title = "", tip = "", actions = "", body = "", foot = "", flush = false, id = "" }) {
  return `<section class="panel ${cls}"${id ? ` id="${id}"` : ""}>${title || actions ? `<header class="ph">${title ? `<h2>${esc(title)}</h2>` : ""}${info(tip)}${actions ? `<div class="pa">${actions}</div>` : ""}</header>` : ""}<div class="pb${flush ? " flush" : ""}">${body}</div>${foot ? `<div class="pf">${foot}</div>` : ""}</section>`;
}
function stat({ k, v, unit = "", s = "", tip = "", spark: values, color = "var(--series)", href, cls = "" }) {
  const inner = `<div class="k">${esc(k)}${info(tip)}</div><div class="vr"><div class="v">${v}${unit ? `<small>${esc(unit)}</small>` : ""}</div>${values ? spark(values, color) : ""}</div><div class="s">${s}</div>`;
  return href ? `<a class="panel stat ${cls}" href="${href}">${inner}</a>` : `<div class="panel stat ${cls}">${inner}</div>`;
}
/* a sparkline has no axes, so it only says "shape"; the tile's number is the value */
function spark(values, color) {
  const pts = values.map((v, i) => [i, v]).filter(([, v]) => v != null);
  if (pts.length < 2) return "";
  const max = Math.max(...pts.map(p => p[1])) || 1, n = values.length - 1 || 1;
  const xy = ([i, v]) => `${(i / n * 100).toFixed(2)},${(29 - v / max * 24).toFixed(2)}`;
  const line = pts.map(xy).join(" ");
  return `<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"><polygon points="${pts[0][0] / n * 100},30 ${line} ${pts[pts.length - 1][0] / n * 100},30" style="fill:${color};opacity:.14"/><polyline points="${line}" style="fill:none;stroke:${color};stroke-width:1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}
const ST = {
  PASS: "pass", stable: "pass", success: "pass", "open-ok": "pass", shipped: "pass",
  RERUN_TARGETED: "flip", flaky: "flip", known_flaky: "flip", suspect: "flip-o", suspect_flaky: "flip-o", action_required: "flip-o",
  REAL_FAILURE: "fail", failing: "fail", real_failure: "fail", new_test: "fail", failure: "fail", timed_out: "fail", startup_failure: "fail",
  quarantined: "quar", perf: "quar",
  in_progress: "run", queued: "run",
};
function tag(kind, text, lg) { return `<span class="tag st-${ST[kind] || "neutral"}${lg ? " lg" : ""}"><i></i>${esc(text || String(kind).replace(/_/g, " "))}</span>`; }
const STATUS_LABEL = { success: "passed", failure: "failed", timed_out: "timed out", cancelled: "cancelled", skipped: "skipped", in_progress: "running", queued: "queued", startup_failure: "failed to start", neutral: "neutral", action_required: "needs approval" };
const statusTag = st => tag(st || "unknown", STATUS_LABEL[st] || st || "unknown");
const DECISION = { PASS: "Pass", RERUN_TARGETED: "Rerun flaky", REAL_FAILURE: "Real failure" };
function strip(outcomes) {
  const fails = outcomes.filter(o => o === "f").length;
  return `<span class="strip" role="img" aria-label="${fails} of the last ${outcomes.length} runs failed" data-tip="${fails} of the last ${outcomes.length} runs failed">${outcomes.map(o => `<i class="${esc(o)}"></i>`).join("")}</span>`;
}
function score(x) { return `<span class="score"><span class="track"><b style="width:${Math.round(x * 100)}%"></b></span>${x.toFixed(2)}</span>`; }
const addedBy = a => a === "auto" ? "by sweep" : a === "manual" ? "by hand" : /^github#\d+$/.test(a) ? `from issue #${a.slice(7)}` : `from ${a}`;
function testCell(id, extra = "") {
  const [cls, name] = splitId(id);
  return `<a class="tl mono" href="${testHref(id)}">${esc(name)}</a>${cls ? `<div class="sub mono">${esc(cls)}</div>` : ""}${extra}`;
}
function cellClass(c) { if (!c) return "n"; const [p, f] = c; return f === 0 ? "p" : p === 0 ? "f" : "x"; }
/* height is the share of runs on that commit that failed: 30% all passed, 100% all failed, in between for a flip */
function cellHeight(c) { if (!c || !c[1]) return ""; return ` style="height:${Math.round(30 + 70 * c[1] / (c[0] + c[1]))}%"`; }
function cells(list, commits) {
  return `<span class="cells">${list.map((c, j) => {
    const cm = commits[j] || {}, id = String(cm.sha || "").slice(0, 8);
    const t = c ? `${id}: ${c[0]} passed, ${c[1]} failed` : `${id}: not run`;
    return `<i class="${cellClass(c)}"${cellHeight(c)} data-tip="${esc(t)}"></i>`;
  }).join("")}</span>`;
}
const fieldLegend = () => `<div class="legend"><span><span class="sw" style="background:var(--pass);height:4px"></span>Passed</span><span><span class="sw" style="background:var(--fail)"></span>Failed every run</span><span><span class="sw" style="background:var(--flip)"></span>Passed and failed on one commit, taller failed more</span><span><span class="sw" style="background:var(--line);height:2px"></span>Not run</span></div>`;
function legend(items) { return `<div class="legend">${items.map(([c, t, ln]) => `<span><span class="sw${ln ? " ln" : ""}" style="background:${c}"></span>${esc(t)}</span>`).join("")}</div>`; }
function errorBox(e) {
  let hint = "";
  if (e.status === 503) hint = `<p class="muted">Record a run first, for example <code>greenlight run -- pytest</code>.</p>`;
  return `<div class="err"><p>${esc(e.message)}</p>${hint}</div>`;
}
const skeleton = () => `<div class="grid"><div class="panel s3 skel"></div><div class="panel s3 skel"></div><div class="panel s3 skel"></div><div class="panel s3 skel"></div></div><div class="grid"><div class="panel s12 skel tall"></div></div>`;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ---------- tables: sortable headers, clickable rows, "show all" ---------- */
const TABLES = {};
function table(id, cols, rows, opt = {}) {
  TABLES[id] = { cols, rows, opt, sort: opt.sort ?? -1, dir: opt.dir ?? -1, limit: opt.limit || 0 };
  return `<div class="tw" id="${id}">${tableInner(id)}</div>`;
}
function tableInner(id) {
  const T = TABLES[id], { cols, opt } = T;
  const rows = T.rows.slice();
  if (T.sort >= 0) {
    const f = cols[T.sort].sort;
    rows.sort((a, b) => { const x = f(a), y = f(b); if (x == null || y == null) return (x == null) - (y == null); return (x < y ? -1 : x > y ? 1 : 0) * T.dir; });
  }
  if (!rows.length) return `<p class="empty">${opt.empty || "Nothing here."}</p>`;
  const shown = T.limit && rows.length > T.limit ? rows.slice(0, T.limit) : rows;
  const head = cols.map((c, i) => `<th class="${c.cls || ""}"${c.sort ? ` data-col="${i}" tabindex="0" aria-sort="${T.sort === i ? (T.dir > 0 ? "ascending" : "descending") : "none"}"` : ""}${c.tip ? ` data-tip="${esc(c.tip)}"` : ""}>${esc(c.h)}</th>`).join("");
  const body = shown.map(r => { const href = opt.href && opt.href(r); return `<tr${href ? ` data-href="${esc(href)}"` : ""}>${cols.map(c => `<td class="${c.cls || ""}">${c.cell(r)}</td>`).join("")}</tr>`; }).join("");
  const more = shown.length < rows.length ? `<div class="more"><button class="btn ghost sm" type="button" data-act="more" data-t="${id}">Show all ${rows.length}</button></div>` : "";
  return `<table class="t"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>${more}`;
}
function sortBy(th) {
  const box = th.closest(".tw"), T = TABLES[box.id], i = Number(th.dataset.col);
  if (T.sort === i) T.dir = -T.dir; else { T.sort = i; T.dir = T.cols[i].dir || -1; }
  box.innerHTML = tableInner(box.id);
}

/* ---------- charts (plain SVG, redrawn on resize) ---------- */
const tip = document.getElementById("tip");
const RO = new ResizeObserver(entries => { for (const e of entries) { const el = e.target; if (el._spec && Math.abs((el._w || 0) - el.clientWidth) > 2) drawChart(el); } });
function chart(el, spec) { if (!el) return; el._spec = spec; drawChart(el); RO.observe(el); }
function niceTicks(max, integer) {

/* ---------- gate decision (overview + run page) ---------- */
function gate(t) {
  if (!t) return `<div class="gate"><span>${tag("unknown", "No runs yet", true)}</span><div class="muted">Record one with <code>greenlight run -- pytest</code>.</div></div>`;
  const ids = list => `<ul class="ids">${list.slice(0, 5).map(id => `<li><a href="${testHref(id)}">${esc(id)}</a></li>`).join("")}${list.length > 5 ? `<li class="muted">and ${list.length - 5} more</li>` : ""}</ul>`;
  let head, body = "";
  if (t.decision === "REAL_FAILURE") {
    head = `${plural(t.blocking.length, "test")} ${t.blocking.length === 1 ? "blocks" : "block"} this commit`;
    body = ids(t.blocking);
  } else if (t.decision === "RERUN_TARGETED") {
    head = `Rerun ${plural(t.rerun_tests.length, "flaky test")}, not the suite`;
    body = ids(t.rerun_tests);
  } else {
    const q = t.failures.length;
    head = q ? `${plural(q, "quarantined failure")} ignored` : "Every test passed";
    if (t.passed_on_retry.length) body = `<div class="muted">${plural(t.passed_on_retry.length, "test")} passed only on retry.</div>`;
  }
  const r = t.run;
  return `<div class="gate"><span>${tag(t.decision, DECISION[t.decision], true)}</span><div class="head">${esc(head)}</div>${body}
    <div class="kv"><span>Commit ${sha(r.commit_sha)}</span><span>Attempt <b>${r.attempt}</b></span>${r.branch ? `<span>Branch <b>${esc(r.branch)}</b></span>` : ""}<span>${when(r.started_at)}</span></div></div>`;
}

      ${perf ? panel({ cls: "s6", title: "Measured", tip: `This check's number on each run${m.names.includes("base_ms") ? ", next to the base build it was measured against" : ""}.${budget != null ? ` Budget ${budget} ms.` : ""}`, body: `<div class="chart" id="c-perf"></div>`, foot: m.names.includes("base_ms") ? legend([["var(--series)", "This build", true], ["var(--ink-3)", "Base build", true]]) : "" }) : ""}
    </div>
    <div class="grid">
      ${panel({ cls: "s5", title: "Failure messages", flush: true, body: d.signatures.length ? `<div class="sigs">${d.signatures.map(g => `<div class="sig"><div class="kv"><span><b>${plural(g.count, "failure")}</b></span><span>last ${when(g.last_at)}</span></div><div class="msg">${esc(g.sample || "(no message)")}</div></div>`).join("")}</div>` : `<p class="empty">No failures in the last ${DAYS} days.</p>` })}
      ${panel({ cls: "s7", title: "Executions", flush: true, actions: `<span class="dim">${d.executions.length}</span>`, body: table("t-exec", execCols, d.executions, { limit: 15, href: e => `#/run/${e.run_id}` }) })}
    </div>`;
  const el = document.getElementById("c-dur");
  chart(el, { days: d.durations.days, label: "Daily median duration", format: "ms", lines: [{ values: d.durations.values, color: "var(--series)", label: "Median", area: true }] });
  if (perf) drawPerf(m);
  const qf = document.getElementById("qf");
  if (qf) qf.addEventListener("submit", async ev => {
    ev.preventDefault();
    try { await post("/api/quarantine", { test_id: d.test_id, reason: document.getElementById("reason").value }); toast(`Quarantined ${name}`); render(); }
    catch (e) { toast(e.message); }
  });
  try {
    const f = await api("/api/test/forecast", { id: d.test_id });
    if (tok !== renderToken) return;
    const hold = f.backtest.p50.length;
    chart(el, { days: f.days, future: f.future_days, format: "ms", label: "Duration with forecast",
      lines: [{ values: f.values, color: "var(--series)", label: "Median" }],
      band: { from: f.days.length - hold, p10: f.backtest.p10.concat(f.future.p10), p50: f.backtest.p50.concat(f.future.p50), p90: f.backtest.p90.concat(f.future.p90) } });
    document.getElementById("dur-foot").innerHTML = legend([["var(--series)", "Daily median", true], ["var(--ink-2)", "Forecast", true], ["var(--band)", "Likely range"]]) + `<div class="dim" style="margin-top:4px">The first ${hold} forecast days are predicted from the days before them. A line above the range means it got slower.</div>`;
  } catch (e) {
    if (tok !== renderToken) return;
    if (e.status !== 501 && !(SNAP && e.status === 404)) document.getElementById("dur-foot").insertAdjacentHTML("beforeend", `<div class="dim" style="margin-top:4px">No forecast: ${esc(e.message)}</div>`);
  }
}

const WHY = {
  quarantined: () => "Quarantined, so the gate ignores it.",
  known_flaky: f => `Flipped on ${f.flip_shas} of ${plural(f.eligible_shas, "commit")}. Rerun this test only.`,
  suspect_flaky: f => `Flipped on ${plural(f.flip_shas, "commit")} before. Rerun this test only.`,
  new_test: () => "First run of this test, so no history to call it flaky. Blocks.",
  real_failure: f => f.flip_shas ? `Has flaked before, but failed ${plural(f.this_sha.fails, "time")} on this commit without passing. Treated as real.` : "No flake history. Blocks.",
};
async function runView(tok, id) {
  const t = await api("/api/run", { id });
  if (tok !== renderToken) return;
  setCrumbs([["Tests"], ["Runs", "#/runs"]], `Run ${t.run.run_id}`);
  const order = { real_failure: 0, new_test: 1, known_flaky: 2, suspect_flaky: 3, quarantined: 4 };
  const fails = [...t.failures].sort((a, b) => order[a.category] - order[b.category]);
  const r = t.run;
  const meta = [
    r.source ? `<span>Source <b>${esc(r.source)}</b></span>` : "",
    r.git_commit && r.git_commit !== r.commit_sha ? `<span>Git commit <code>${esc(r.git_commit.slice(0, 8))}</code></span>` : "",
    r.command ? `<span><code>${esc(r.command)}</code></span>` : "",
    r.session ? (isUrl(r.url) ? `<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.session)}</a>` : `<span>${esc(r.session)}</span>`) : isUrl(r.url) ? `<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">Open the run</a>` : "",
  ].join("");
  const partial = r.results_named < r.tests ? `Only the checks that failed or ran slower are named; ${plural(r.tests - r.results_named, "other check")} not listed.` : "";
  const cols = [
    { h: "Verdict", cell: f => `${tag(f.category)}${f.new_signature ? `<div style="margin-top:4px">${tag("failing", "new message")}</div>` : ""}`, sort: f => order[f.category], dir: 1, cls: "fit" },
    { h: "Test", cell: f => `${testCell(f.test_id)}<div class="why">${esc(WHY[f.category](f))}</div>${f.message ? `<div class="msg">${esc(f.message)}</div>` : ""}`, sort: f => f.test_id, dir: 1, cls: "wrap" },
    { h: "Flipped", cell: f => `${f.flip_shas}<span class="dim"> / ${f.eligible_shas}</span>`, sort: f => f.flip_shas, cls: "num fit hide-sm" },
  ];
  view.innerHTML = `
    <div class="grid">

    </div>
    <div class="grid">
      ${panel({ title: t.failures.length ? "Failing tests" : "No failing tests", tip: `${plural(r.tests, "test")} ran. Blocking failures come first.`, flush: true, actions: `<span class="dim">${t.failures.length} of ${r.tests}</span>`,
        body: t.failures.length ? table("t-fails", cols, fails, { sort: 0, dir: 1 }) : `<p class="empty">Every test passed on the final attempt.</p>`, foot: partial })}
    </div>
    ${t.passed_on_retry.length ? `<div class="grid">${panel({ title: "Passed only on retry", tip: "Failed at least once in this run, then passed. Counts toward flake history, doesn't block.", body: `<ul class="ids">${t.passed_on_retry.map(id => `<li><a href="${testHref(id)}">${esc(id)}</a></li>`).join("")}</ul>` })}</div>` : ""}`;
}

    chart(document.getElementById(`c-reg-${i}`), { days: r.days, height: 130, format: "ms", label: `Duration of ${r.series}`,

      const f = await api("/api/trends/suite", { metric: key });

      chart(el, { days: f.recent.map(r => r.day), future: f.forecast.map(r => r.day), format: fmt, label, height: 220,

      const a = f.recent_anomaly;
      note.innerHTML = legend([[color, label, true], ["var(--ink-2)", "Forecast", true], ["var(--band)", "Likely range"]]) +
        (a ? `<div style="margin-top:6px">${tag("failing", "Above forecast")} <span class="muted">${a.map(b => `${esc(fmtDay(b.day))}: ${esc(FMT[fmt](b.actual))}, expected ${esc(FMT[fmt](b.expected_p50))}`).join("; ")}</span></div>` : "");
    } catch (e) { el.innerHTML = ""; note.innerHTML = errorBox(e); }

function waterfall(jobs) {
  const span = Math.max(1, ...jobs.map(j => (j.offset_ms || 0) + (j.duration_ms || 0)));
  const ticks = timeTicks(span), top = ticks[ticks.length - 1] || span, step = ticks[1] - ticks[0];
  const at = v => `${(100 * Math.max(0, v) / top).toFixed(3)}%`;
  const grid = `background-size:${(100 * step / top).toFixed(3)}% 100%`;
  const bar = (off, d, st, label, thin) => `<i class="bar st-${ST[st] || "neutral"}${thin ? " thin" : ""}" style="left:${at(off)};width:${at(d)}" data-tip="${esc(label)}"></i>`;
  const rows = jobs.map(j => {
    const steps = j.steps || [], start = Date.parse(j.started_at);
    const label = `${j.name}: ${STATUS_LABEL[j.status] || j.status}, ${dur(j.duration_ms)}${j.queue_ms != null ? `, waited ${dur(j.queue_ms)} for a runner` : ""}`;
    const head = `<span class="wn">${steps.length ? icon("right") : `<span style="width:12px;flex:none"></span>`}${esc(j.name)}</span><span class="track" style="${grid}">${bar(j.offset_ms || 0, j.duration_ms || 0, j.status, label)}</span><span class="num">${dur(j.duration_ms)}</span>`;
    if (!steps.length) return `<div class="wr">${head}</div>`;
    const sub = steps.map(s => {
      const off = (j.offset_ms || 0) + (s.started_at && !isNaN(start) ? Date.parse(s.started_at) - start : 0);
      return `<div class="wr sub"><span class="wn">${esc(s.name)}</span><span class="track" style="${grid}">${bar(off, s.duration_ms || 0, s.status, `${s.name}: ${STATUS_LABEL[s.status] || s.status}, ${dur(s.duration_ms)}`, true)}</span><span class="num">${dur(s.duration_ms)}</span></div>`;
    }).join("");
    return `<details class="wj"><summary class="wr">${head}</summary>${sub}</details>`;
  }).join("");
  return `<div class="wf"><div class="wr wax"><span>Job</span><span class="track">${ticks.map(t => `<b style="left:${at(t)}">${esc(AXIS.ms(t))}</b>`).join("")}</span><span></span></div>${rows}</div>`;
}
async function pipelineView(tok, id) {
  const d = await api("/api/pipeline", { id });
  if (tok !== renderToken) return;
  const p = d.pipeline;
  setCrumbs([["Delivery"], ["Pipelines", "#/pipelines"]], `${p.workflow} #${p.run_number}`);
  view.innerHTML = `
    <div class="grid">
      <section class="panel s12 ent">
        <div class="bar2"><span class="title">${esc(p.workflow)} <span class="dim">#${esc(p.run_number)}</span></span>${isUrl(p.url) ? `<a class="lnk" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">Open on GitHub ${icon("ext")}</a>` : ""}</div>
        <div><span class="tags">${statusTag(p.status)}</span></div>
        <div class="kv">
          <span>Attempt <b>${p.attempt}</b> of ${d.attempts.length}${d.attempts.length > 1 ? `: ${d.attempts.map(a => a.pipeline_id === p.pipeline_id ? `<b>${a.attempt}</b>` : `<a href="${pipeHref(a.pipeline_id)}">${a.attempt}</a>`).join(", ")}` : ""}</span>
          <span>Branch <b>${esc(p.branch || "n/a")}</b></span>
          <span>Commit ${sha(p.commit_sha)}</span>
          <span>Event <b>${esc(p.event || "n/a")}</b></span>
          <span>Took <b>${dur(p.duration_ms)}</b></span>
          <span>Queued <b>${dur(p.queue_ms)}</b></span>
          ${p.actor ? `<span>By <b>${esc(p.actor)}</b></span>` : ""}
          <span>${when(p.created_at)}</span>
        </div>
      </section>
    </div>
    <div class="grid">
      ${panel({ title: "Jobs", tip: "Each bar starts when its job started, on one time scale. Open a job for its steps.", flush: true, actions: `<span class="dim">${plural(d.jobs.length, "job")}</span>`,
        body: d.jobs.length ? waterfall(d.jobs) : `<p class="empty">No jobs recorded for this attempt.</p>`, foot: d.jobs.length ? legend([["var(--pass)", "Passed"], ["var(--fail)", "Failed"], ["var(--ink-3)", "Other"]]) : "" })}
    </div>
    ${d.test_runs.length ? `<div class="grid">${panel({ title: "Test runs on this commit", body: `<ul class="ids">${d.test_runs.map(r => `<li><a href="#/run/${r.run_id}">Run ${r.run_id}</a> <span class="dim">attempt ${r.attempt}</span></li>`).join("")}</ul>` })}</div>` : ""}`;
}

/* ---------- delivery: DORA, pull requests, issues ---------- */
let deliveryEnv = null;
async function deliveryView(tok) {
  const params = { days: DAYS };
  if (deliveryEnv) params.env = deliveryEnv;
  const d = await api("/api/delivery", params);
  if (tok !== renderToken) return;
  setSynced(d.synced);
  const o = d.dora, m = o.metrics, pr = d.prs, is = d.issues;
  const envs = o.environments || [];
  const link = (url, text) => isUrl(url) ? `<a class="tl" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${text}</a>` : text;
  const depCols = [
    { h: "When", cell: r => when(r.deployed_at), sort: r => r.deployed_at, cls: "nw" },
    { h: "Version", cell: r => link(r.url, esc(r.version || r.source)), sort: r => r.version, dir: 1, cls: "wrap" },
    { h: "Commit", cell: r => sha(r.commit_sha), cls: "nw hide-sm" },
    { h: "Commits", cell: r => r.commits, sort: r => r.commits, cls: "num hide-sm" },
    { h: "Lead time", cell: r => hrs(r.lead_time_p50_h), sort: r => r.lead_time_p50_h, cls: "num" },
    { h: "Result", cell: r => r.failed ? tag("failure", r.incidents.length ? `incident ${r.incidents.map(n => "#" + n).join(", ")}` : "failed") : tag("success", "shipped"), sort: r => r.failed ? 1 : 0 },
  ];
  const prCols = [
    { h: "#", cell: x => `<span class="dim">${x.number}</span>`, sort: x => x.number, cls: "num" },
    { h: "Title", cell: x => `${link(x.url, esc(x.title))}<div class="sub">${esc(x.head || "")}${x.author ? `, ${esc(x.author)}` : ""}</div>`, sort: x => x.title, dir: 1, cls: "wrap" },
    { h: "Age", cell: x => hrs(x.age_h), sort: x => x.age_h, cls: "num" },
  ];
  const mgCols = [
    { h: "#", cell: i => link(i.url, `#${i.number}`), sort: i => i.number, cls: "num" },
    { h: "Kind", cell: i => i.kind === "flaky" ? tag("flaky", "flaky") : tag("perf", "perf"), sort: i => i.kind, dir: 1 },
    { h: "Test", cell: i => testCell(i.test_id), sort: i => i.test_id, dir: 1, cls: "wrap" },
    { h: "State", cell: i => i.state === "open" ? tag("open-ok", "open") : tag("closed", "closed"), sort: i => i.state, dir: 1 },
  ];
  const oldCols = [
    { h: "#", cell: i => `<span class="dim">${i.number}</span>`, sort: i => i.number, cls: "num" },
    { h: "Title", cell: i => link(i.url, esc(i.title)), sort: i => i.title, dir: 1, cls: "wrap" },
    { h: "Labels", cell: i => `<span class="muted">${esc((i.labels || []).slice(0, 3).join(", "))}</span>`, cls: "hide-sm" },
    { h: "Age", cell: i => hrs(i.age_h), sort: i => i.age_h, cls: "num" },
  ];
  const vars = envs.length > 1 ? `<div class="vars"><label class="var"><span>Environment</span><select id="env">${envs.map(e => `<option value="${esc(e.environment)}"${e.environment === o.environment ? " selected" : ""}>${esc(e.environment)} (${e.deployments})</option>`).join("")}</select></label></div>` : "";
  const dora = !envs.length ? `<div class="grid">${noData("No deployments recorded yet.", "Say what a release is under <code>[delivery]</code> in <code>greenlight.toml</code>: <code>deploy_branch</code>, <code>deploy_files</code>, <code>deploy_environment</code> or <code>deploy_releases</code>. Then run <code>greenlight sync</code>.")}</div>` : `
    <div class="grid">
      ${stat({ cls: "s3", k: "Deployment frequency", v: m.deploys_per_day, unit: "a day", s: `${plural(m.deployments, "deployment")} on ${plural(m.deploy_days, "day")}`, spark: o.deploys_per_day })}
      ${stat({ cls: "s3", k: "Lead time for changes", v: hrs(m.lead_time_p50_h), s: `median, p90 ${hrs(m.lead_time_p90_h)}`, tip: "From each shipped commit to its deployment.", spark: o.lead_time_per_day })}
      ${stat({ cls: "s3", k: "Change failure rate", v: m.change_failure_rate == null ? "n/a" : pct(m.change_failure_rate), s: `${m.failed_deployments} failed or caused an incident`, tip: `An incident is an issue labeled ${(o.incident_labels || []).join(", ")}, tied to the last deployment before it opened.` })}
      ${stat({ cls: "s3", k: "Time to restore", v: hrs(m.time_to_restore_p50_h), s: `${plural(m.incidents, "incident")}, ${m.open_incidents} open` })}
    </div>
    <div class="grid">
      ${panel({ cls: "s6", title: "Deployments per day", body: `<div class="chart" id="c-dep"></div>` })}
      ${panel({ cls: "s6", title: "Lead time", tip: "Median per day, from each shipped commit to its deployment.", body: `<div class="chart" id="c-lead"></div>` })}
    </div>
    <div class="grid">
      ${panel({ title: `Deployments to ${o.environment}`, flush: true, actions: `<span class="dim">${o.deployments.length}</span>`, body: table("t-dep", depCols, o.deployments, { limit: 15, empty: `No deployments to ${esc(o.environment)} in the last ${DAYS} days.` }) })}
    </div>`;
  const prs = pr.metrics.merged + pr.metrics.open + pr.metrics.opened ? `
    <div class="grid">
      ${stat({ cls: "s3", k: "Merged", v: pr.metrics.merged, s: `${pr.metrics.opened} opened`, spark: pr.merged_per_day })}
      ${stat({ cls: "s3", k: "Time to merge", v: hrs(pr.metrics.time_to_merge_p50_h), s: `median, p90 ${hrs(pr.metrics.time_to_merge_p90_h)}` })}
      ${stat({ cls: "s3", k: "Open", v: pr.metrics.open, s: pr.open.length ? `oldest ${hrs(pr.open[0].age_h)}` : "none waiting" })}
      ${stat({ cls: "s3", k: "Closed unmerged", v: pr.metrics.closed_unmerged, s: "abandoned or replaced" })}
    </div>
    <div class="grid">
      ${panel({ cls: "s6", title: "Merged per day", body: `<div class="chart" id="c-prs"></div>` })}
      ${panel({ cls: "s6", title: "Open pull requests", flush: true, actions: `<span class="dim">${pr.open.length}</span>`, body: table("t-pr", prCols, pr.open, { sort: 2, limit: 8, empty: "Nothing open." }) })}
    </div>` : `<div class="grid">${noData("No pull requests synced.", "Run <code>greenlight sync</code> with <code>[github] repo</code> set.")}</div>`;
  const issues = is.metrics.open + is.metrics.opened + is.managed.length ? `
    <div class="grid">
      ${stat({ cls: "s3", k: "Open", v: is.metrics.open, s: `median age ${hrs(is.metrics.open_age_p50_h)}`, spark: is.open_per_day })}
      ${stat({ cls: "s3", k: "Opened", v: is.metrics.opened, s: `in ${DAYS} days`, spark: is.opened_per_day })}
      ${stat({ cls: "s3", k: "Closed", v: is.metrics.closed, s: `median ${hrs(is.metrics.time_to_close_p50_h)} to close`, spark: is.closed_per_day })}
      ${stat({ cls: "s3", k: "Opened by greenlight", v: is.managed.filter(i => i.state === "open").length, s: "flaky tests and perf, open" })}
    </div>
    <div class="grid">
      ${panel({ cls: "s6", title: "Open issues", tip: "How many were open at the end of each day.", body: `<div class="chart" id="c-iss"></div>` })}
      ${panel({ cls: "s6", title: "Flaky test and perf issues", flush: true, body: table("t-mg", mgCols, is.managed, { limit: 10, empty: "None yet. <code>greenlight issues</code> shows what it would open." }) })}
    </div>
    ${is.oldest_open.length ? `<div class="grid">${panel({ title: "Oldest open issues", flush: true, body: table("t-old", oldCols, is.oldest_open, { sort: 3, limit: 8 }) })}</div>` : ""}`
    : `<div class="grid">${noData("No issues synced.", "Run <code>greenlight sync</code> with <code>[github] repo</code> set.")}</div>`;
  view.innerHTML = `${vars}${dora}
    <div class="row-title">Pull requests</div>${prs}
    <div class="row-title">Issues</div>${issues}`;
  if (envs.length) {
    chart(document.getElementById("c-dep"), { days: o.days, label: "Deployments per day", bars: [{ values: o.deploys_per_day, color: "var(--series)", label: "Deployments" }] });
    chart(document.getElementById("c-lead"), { days: o.days, label: "Median lead time per day", format: "h", lines: [{ values: o.lead_time_per_day, color: "var(--series)", label: "Lead time", dots: true }] });
  }
  const prEl = document.getElementById("c-prs");
  if (prEl) chart(prEl, { days: pr.days, label: "Pull requests merged per day", bars: [{ values: pr.merged_per_day, color: "var(--series)", label: "Merged" }] });
  const isEl = document.getElementById("c-iss");
  if (isEl) chart(isEl, { days: is.days, label: "Open issues at the end of each day", lines: [{ values: is.open_per_day, color: "var(--series)", label: "Open", area: true }] });
  const env = document.getElementById("env");
  if (env) env.addEventListener("change", () => { deliveryEnv = env.value; render(); });
}

/* ---------- actions (quarantine, show all) ---------- */
document.addEventListener("click", async ev => {
  const th = ev.target.closest("th[data-col]");
  if (th) { sortBy(th); return; }
  const b = ev.target.closest("button[data-act]");
  if (b) {
    const a = b.dataset.act;
    if (a === "more") { TABLES[b.dataset.t].limit = 0; document.getElementById(b.dataset.t).innerHTML = tableInner(b.dataset.t); return; }
    if (!LIVE) return;
    b.disabled = true;
    try {
      if (a === "qall") { const r = await post("/api/sweep", { apply: true }); toast(`Quarantined ${plural(r.to_quarantine.length, "test")}`); }
      else if (a === "q") { await post("/api/quarantine", { test_id: b.dataset.id, reason: b.dataset.why }); toast(`Quarantined ${splitId(b.dataset.id)[1]}`); }
      else if (a === "u") { await post("/api/unquarantine", { test_id: b.dataset.id }); toast(`Released ${splitId(b.dataset.id)[1]}`); }
      render();
    } catch (e) { b.disabled = false; toast(e.message); }
    return;
  }
  const tr = ev.target.closest("tr[data-href]");
  if (tr && !ev.target.closest("a, button, input, select, summary, label")) location.hash = tr.dataset.href;
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.matches && ev.target.matches("th[data-col]")) sortBy(ev.target);
  if (ev.key === "Escape") { closeMenu(); document.body.classList.remove("nav-open"); tipOff(); }
});

/* ---------- shell: crumbs, sync status, time range, theme, nav drawer ---------- */
function setCrumbs(trail, title) {
  document.getElementById("crumbs").innerHTML = trail.map(([label, href]) => `${href ? `<a href="${href}">${esc(label)}</a>` : `<span>${esc(label)}</span>`}${icon("right")}`).join("") + `<h1>${esc(title)}</h1>`;
  document.title = `${title} · greenlight`;
}
function setSynced(synced) {
  const box = document.getElementById("sync");
  if (SNAP) { box.innerHTML = `<span class="pulse off"></span><span>Snapshot, ${esc(full(SNAP.generated_at))}</span>`; return; }
  const entries = Object.entries(synced || {});
  if (!entries.length) return;
  const latest = entries.map(e => e[1]).sort().pop();
  const stale = (NOW - new Date(latest)) / 3600000 > 24;
  box.innerHTML = `<span class="pulse${stale ? " off" : ""}"></span><span data-tip="${esc(entries.map(([k, v]) => `${k} ${ago(v)}`).join(", "))}">Synced ${esc(ago(latest))}</span>`;
}
const range = document.getElementById("range"), rangeMenu = document.getElementById("range-menu");
let windowed = true;
function syncRange() {
  document.getElementById("range-label").textContent = `Last ${DAYS} days`;
  rangeMenu.innerHTML = RANGES.map(n => `<button type="button" role="menuitemradio" aria-checked="${n === DAYS}" data-days="${n}">${icon("check")}Last ${n} days</button>`).join("");
}
function closeMenu() { rangeMenu.hidden = true; range.setAttribute("aria-expanded", "false"); }
range.addEventListener("click", () => {
  if (!windowed || SNAP) return;
  const open = rangeMenu.hidden;
  rangeMenu.hidden = !open; range.setAttribute("aria-expanded", String(open));
  if (open) rangeMenu.querySelector('[aria-checked="true"]').focus();
});
rangeMenu.addEventListener("click", ev => {
  const b = ev.target.closest("button[data-days]"); if (!b) return;
  DAYS = Number(b.dataset.days);
  try { localStorage.setItem("greenlight-days", String(DAYS)); } catch { /* storage unavailable */ }
  closeMenu(); syncRange(); render();
});
document.addEventListener("pointerdown", ev => { if (!ev.target.closest("#picker")) closeMenu(); });
const themeBtn = document.getElementById("theme");
function syncTheme() {
  const light = document.documentElement.dataset.theme === "light";
  themeBtn.innerHTML = icon(light ? "moon" : "sun");
  themeBtn.dataset.tip = light ? "Dark theme" : "Light theme";
  themeBtn.setAttribute("aria-label", themeBtn.dataset.tip);
}
themeBtn.addEventListener("click", () => {
  const light = document.documentElement.dataset.theme !== "light";
  if (light) document.documentElement.dataset.theme = "light"; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem("greenlight-theme", light ? "light" : "dark"); } catch { /* storage unavailable */ }
  syncTheme(); tipOff();
});
document.getElementById("menu-btn").addEventListener("click", () => document.body.classList.toggle("nav-open"));
document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("nav-open"));
document.getElementById("refresh").addEventListener("click", () => render());

/* ---------- router ---------- */
const ROUTES = [
  [/^#?\/?$/, "overview", [["Tests"]], "Overview", tok => overviewView(tok), true],
  [/^#\/flaky$/, "flaky", [["Tests"]], "Flaky tests", tok => flakyView(tok), true],
  [/^#\/test\/(.+)$/, "flaky", [["Tests"], ["Flaky tests", "#/flaky"]], "Test", (tok, m) => testView(tok, decodeURIComponent(m[1])), true],
  [/^#\/runs$/, "runs", [["Tests"]], "Runs", tok => runsView(tok), false],
  [/^#\/run\/(\d+)$/, "runs", [["Tests"], ["Runs", "#/runs"]], "Run", (tok, m) => runView(tok, Number(m[1])), false],
  [/^#\/quarantine$/, "quarantine", [["Tests"]], "Quarantine", tok => quarantineView(tok), true],
  [/^#\/trends$/, "trends", [["Tests"]], "Trends", tok => trendsView(tok), false],
  [/^#\/pipelines$/, "pipelines", [["Delivery"]], "Pipelines", tok => pipelinesView(tok), true],
  [/^#\/pipeline\/(.+)$/, "pipelines", [["Delivery"], ["Pipelines", "#/pipelines"]], "Pipeline run", (tok, m) => pipelineView(tok, decodeURIComponent(m[1])), false],
  [/^#\/delivery$/, "delivery", [["Delivery"]], "DORA and GitHub", tok => deliveryView(tok), true],
];
let lastHash = null;
async function render() {
  const tok = ++renderToken;
  tipOff(); closeMenu();
  const hash = location.hash || "#/";
  const hit = ROUTES.map(r => [hash.match(r[0]), ...r.slice(1)]).find(r => r[0]) || [null, ...ROUTES[0].slice(1)];
  const [m, nav, trail, title, fn, isWindowed] = hit;
  windowed = isWindowed;
  range.setAttribute("aria-disabled", String(!windowed || !!SNAP));
  if (!windowed) range.dataset.tip = "This view isn't filtered by time"; else delete range.dataset.tip;
  document.querySelectorAll("#nav a").forEach(a => { if (a.dataset.nav === nav) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  setCrumbs(trail, title);
  if (hash !== lastHash) { view.innerHTML = skeleton(); lastHash = hash; } else view.classList.add("busy");
  const bar = document.getElementById("bar"); bar.hidden = false;
  try { await fn(tok, m); }
  catch (e) { if (tok === renderToken) view.innerHTML = errorBox(e); }
  finally { if (tok === renderToken) { bar.hidden = true; view.classList.remove("busy"); } }
}

/* ---------- boot ---------- */
if (SNAP) {
  document.getElementById("picker").hidden = true;
  document.getElementById("refresh").hidden = true;
  const chip = document.getElementById("snapchip");
  chip.hidden = false;
  chip.textContent = `Snapshot, last ${SNAP.days} days`;
  chip.dataset.tip = `Read-only, taken ${full(SNAP.generated_at)}`;
  setSynced(null);
}
syncRange(); syncTheme();
window.addEventListener("hashchange", () => { document.body.classList.remove("nav-open"); render(); view.focus({ preventScroll: true }); window.scrollTo(0, 0); });
render().then(() => {
  /* the sidebar's sync status comes with the overview; fetch it once when starting elsewhere */
  if (location.hash && location.hash !== "#/" && LIVE) api("/api/overview", { days: DAYS }).then(d => setSynced(d.synced)).catch(() => {});
});
</script>
