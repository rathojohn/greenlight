/* ---------- commits and merges, and the conversations they came from ---------- */
const COMMIT_TABS = [["", "Commits"], ["merges", "Merges"]];
const prCell = p => p ? `<span class="dim">#${p.number}</span> ${esc(p.title || "")}` : "";
const testsCell = c => c.decision ? `${tag(c.decision, DECISION[c.decision])}${c.runs > 1 ? `<div class="sub">${plural(c.runs, "run")}</div>` : ""}` : "";
const ciCell = c => c.ci ? statusTag(c.ci) : "";
/* rows whose conversations include the one picked, or none when "none" is */
const convMatch = (convs, want) => !want || (want === "none" ? !convs.length : convs.some(c => c.session_id === want));
function convOptions(rows, convsOf) {
  const all = rows.flatMap(r => convsOf(r).map(c => ({ c })));
  return { options: optionsOf(all, x => x.c.session_id, x => convName(x.c)),
           extra: rows.some(r => !convsOf(r).length) && all.length ? [["none", "None recorded"]] : [] };
}
async function commitsView(tok, tab) {
  const d = await api("/api/commits", { days: DAYS });

  const tabs = `<nav class="tabs" aria-label="Commits">${COMMIT_TABS.map(([k, label]) => `<a href="#/commits${k ? "/" + k : ""}"${k === tab ? ` aria-current="page"` : ""}>${label} <span class="n">${(k ? d.merges : d.commits).length}</span></a>`).join("")}</nav>`;
  const conv = filterVal("conv");

    const cols = [

      { h: "Commits", cell: m => m.commits || "", sort: m => m.commits, cls: "num hide-sm", tip: "Commits on its branch that something recorded: a session, a test run or CI" },
      { h: "Tests", cell: testsCell, sort: m => m.decision, dir: 1 },
      { h: "CI", cell: ciCell, sort: m => m.ci, dir: 1, cls: "hide-sm" },

    const co = convOptions(d.merges, m => m.conversations);
    view.innerHTML = tabs + filterBar([{ k: "conv", label: "Conversation", ...co }]) + `<div class="grid">${panel({ title: "Merged pull requests", flush: true,

      actions: `<span class="dim">${plural(rows.length, "merge")}</span>`,

    && (!f.kind || c.kind === f.kind) && convMatch(c.conversations, conv));

    { h: "CI", cell: ciCell, sort: c => c.ci, dir: 1, cls: "hide-sm", tip: "The latest attempt of each workflow on it" },

  const co = convOptions(d.commits, c => c.conversations);

  const filters = `<div class="fbar">${chipBar("kind", [["commit", "Commits", kinds.get("commit") || 0], ["merge", "Merges", kinds.get("merge") || 0]], "Everything")}${filterBar([

  view.innerHTML = tabs + filters + `

      ${stat({ cls: "s3", k: "From a conversation", v: rows.length ? pct(fromConv / rows.length) : "n/a", s: `${plural(fromConv, "commit")} a recorded session made or merged`, tip: "The usage hook records each commit a Claude Code session makes and each pull request it merges." })}
      ${stat({ cls: "s3", k: "Real failures", v: rows.filter(c => c.decision === "REAL_FAILURE").length, s: "latest test run blocked" })}
      ${stat({ cls: "s3", k: "Failed CI", v: rows.filter(c => c.ci === "failure").length, s: "a workflow's latest attempt failed" })}
    </div>
    <div class="grid">${panel({ title: "Commits", flush: true, tip: "Every commit something recorded: a session that made or merged it, a test run, CI, a pull request or a release. Open one for all of it.",
      actions: `<span class="dim">${plural(rows.length, "commit")}</span>`,
      body: table("t-commits", cols, rows, { limit: 20, panel: c => `commit:${c.sha}`, empty: "No commit matches these filters." }) })}</div>`;
}

/* ---------- token usage (Claude Code) ---------- */
const COST_TIP = "Tokens priced like input tokens of their model, from Claude's API prices: output 5x, a cache read 0.1x (0.05x on Opus 5.5), a cache write 1.25x (2x when it lasts an hour). A unit every model shares, so sessions compare.";
const USD_TIP = "The same tokens at each model's API list price. On a Pro or Max plan you aren't billed this.";
const usdCol = { h: "API price", cell: r => money(r.dollars), sort: r => r.dollars || 0, cls: "num", tip: USD_TIP };
const CTX_NAMES = { system: "System prompt and tools", conversation: "Conversation", test: "Test runs", build: "Builds", git: "git and gh", read: "File reads", search: "Searches", web: "Web", shell: "Other shell commands", image: "Images", edit: "Edits", subagent: "Subagent reports", skill: "Skills", other: "Other tools" };
const CTX_HINT = { system: "What every request starts with: instructions, tool definitions, CLAUDE.md", conversation: "Claude's own replies, your messages, reminders", read: "Read, and cat, sed or head in a shell", search: "Grep, Glob, and grep, find or ls in a shell", web: "WebFetch, WebSearch, curl", image: "Screenshots and pictures, priced by size" };
const CTX_ADVICE = {
  conversation: "Everything Claude wrote and every message stays in context and is read again by each request. Use /compact between tasks, or start a new session for new work. Asking for edits instead of whole-file rewrites keeps replies short.",
  system: "Paid on every request. Keep CLAUDE.md and always-on instructions short, and turn off MCP servers a project doesn't use: each one adds its tool definitions.",
  read: "A file read stays in context until the session compacts. Read with an offset and limit, or Grep for the lines first. Lockfiles, snapshots and logs are rarely worth reading whole.",
  test: "A test run's output stays in context for the rest of the session. Run only the tests the change needs, with a quiet reporter, and send long logs to a file to read just the failures.",
  search: "Narrow searches with a path or glob and a result limit.",
  shell: "Long command output stays in context. Pipe it through tail or grep, or into a file.",
  image: "An image costs about width x height / 750 tokens and stays in context like text. Look at screenshots in a subagent and keep only its verdict.",
  web: "Fetched pages stay in context. Ask WebFetch a narrow question so it returns less.",
  git: "Use --stat, --oneline and -n; a full diff of a big change is long.",
  edit: "Edits are cheap: only the change goes into context.",
  subagent: "A subagent's report is all the main session keeps. Ask for short reports.",
  build: "Build output stays in context. Keep it quiet unless it fails.",
  skill: "A skill's instructions load once and stay in context.",
  other: "Results of other tools.",
};
const WASTE = {
  switches: { title: "Earlier tasks still in context", advice: "When a session moves to a new branch, the work before it stays in context and every later request reads it again. /compact with a note of what to keep, or a new session, drops it." },
  idle: { title: "Cache rebuilt after idle", advice: "The prompt cache lasts an hour in a main session and 5 minutes in a subagent. The first request after a longer break writes the whole context again at the cache write price. Coming back to start new work? Begin a new session instead." },
  repeats: { title: "Files read again", advice: "Reads of the same file and range while the first read was still in context and nothing had edited it." },
};
const ctxName = c => CTX_NAMES[c] || (c.startsWith("mcp:") ? `MCP: ${c.slice(4)}` : c);
const shareOf = (n, total) => !total || !n ? "0%" : n / total < .001 ? "<0.1%" : `${Math.round(n / total * 1000) / 10}%`;
const meter = (n, total) => `<span class="meter"><i style="width:${total ? Math.min(100, n / total * 100) : 0}%"></i></span> ${shareOf(n, total)}`;
/* a claude.ai id when there is one; a local session's UUID is recognizable by its first block */
const sessionName = x => x.remote_session || (/^[0-9a-f]{8}-[0-9a-f-]{27}$/.test(x.session_id || "") ? x.session_id.slice(0, 8) : String(x.session_id || ""));
/* a conversation by its first prompt when the hook sent one, else by its id */
const convName = x => x.title || sessionName(x);
const convLabel = x => x.title ? esc(x.title) : `<span class="mono">${esc(sessionName(x))}</span>`;
const HOW = { made: "made it", merged: "merged it", tested: "ran its tests", worked: "worked on it" };
/* a conversation in a table cell: opens its side panel; a row that opens something else still can */
const convCell = (c, more = 0) => c ? `${panelLink(`session:${c.session_id}`, convLabel(c))}<div class="sub">${esc(HOW[c.how] || "")}${more ? `${c.how ? ", " : ""}${plural(more, "other")}` : ""}</div>` : "";
/* how to get back to a conversation: its page on claude.ai, or resuming it where it ran */
const resumeCmd = x => `claude --resume ${x.session_id}`;
const copyBox = text => `<div class="copy"><code>${esc(text)}</code><button class="tb icon" type="button" data-act="copy" data-copy="${esc(text)}" aria-label="Copy" data-tip="Copy">${icon("copy")}</button></div>`;
const ext = (url, text) => isUrl(url) ? `<a class="tb" href="${esc(url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(text)}"><span class="lbl">${esc(text)}</span>${icon("ext")}</a>` : "";
const goto = (href, text) => `<a class="tb" href="${esc(href)}" aria-label="${esc(text)}"><span class="lbl">${esc(text)}</span>${icon("right")}</a>`;
const prState = st => st === "merged" ? tag("success", "merged") : st === "open" ? tag("open-ok", "open") : tag("closed", st);
const tokenFacts = r => facts([["Cost", tk(r.weighted), COST_TIP], ...(r.dollars != null ? [["API price", money(r.dollars), USD_TIP]] : []), ["Output", tk(r.output_tokens)], ["Cache reads", tk(r.cache_read_tokens)], ["Requests", tk(r.requests)]]);
function ctxTable(id, cats, total, limit = 8) {
  return boxed(table(id, [
    { h: "What", cell: c => panelLink(`cat:${c.category}`, esc(ctxName(c.category))), sort: c => ctxName(c.category), dir: 1, cls: "wrap" },
    { h: "Re-read", cell: c => tk(c.carried_tokens), sort: c => c.carried_tokens, cls: "num" },
    { h: "Share", cell: c => meter(c.weighted, total), sort: c => c.weighted, cls: "num nw" },

}
const sessionCols = [
  { h: "Session", cell: x => convLabel(x), sort: x => convName(x), dir: 1, cls: "wrap" },
  { h: "Last active", cell: x => when(x.last_at), sort: x => x.last_at, cls: "nw hide-sm" },
  { h: "Cost", cell: x => tk(x.weighted), sort: x => x.weighted, cls: "num" },
  usdCol,
];

  file: "A file read stays until the session compacts. Read only the lines needed: an offset and limit, or Grep first.",
  command: "Command output stays in context. Pipe long output through tail or grep, or into a file to read the part that matters.",

/* ---------- actions (quarantine, pages, side panels) ---------- */
document.addEventListener("click", async ev => {
  const th = ev.target.closest("th[data-col]");
  if (th) { sortBy(th); return; }
  const b = ev.target.closest("button[data-act]");
  if (b) {
    const a = b.dataset.act;
    if (a === "page") { const T = TABLES[b.dataset.t]; T.page += Number(b.dataset.d); document.getElementById(b.dataset.t).innerHTML = tableInner(b.dataset.t); stepButtons(); return; }
    if (a === "step") { stepPanel(Number(b.dataset.d)); return; }
    if (a === "close") { setPanel(null, true); return; }
    if (a === "copy") { navigator.clipboard.writeText(b.dataset.copy).then(() => toast("Copied"), () => toast(b.dataset.copy)); return; }
    if (b.closest("#pmenu")) {
      const m = document.getElementById("pmenu"), i = Number(m.dataset.i); closePop();
      if (a === "dsettings") { setPanel(`dsettings:${DASH.id}`); return; }
      if (a === "djson") { navigator.clipboard.writeText(JSON.stringify(specOf(DASH), null, 2)).then(() => toast("Copied the dashboard as JSON"), () => toast("Couldn't copy")); return; }
      if (a === "ddel") { if (!LIVE) return; try { await post("/api/dashboards/delete", { id: DASH.id }); toast("Deleted"); location.hash = "#/dashboards"; } catch (e) { toast(e.message); } return; }
      if (a === "ddel0") { popMenu(document.querySelector('[data-act="dmenu"]'), [["ddel", `Delete ${DASH.title} for good`, "x"]]); return; }
      if (a === "premove0") { m.dataset.i = i; popMenu(document.querySelector(`[data-act="pmenu"][data-i="${i}"]`), [["premove", "Remove it for good", "x"]]); return; }
      panelAction(a, i); return;
    }
    if (a === "pmenu" || a === "dmenu") {
      const m = document.getElementById("pmenu"), i = Number(b.dataset.i), p = DASH && DASH.panels[i];
      if (!m.hidden && m.dataset.from === `${a}:${b.dataset.i || ""}`) { closePop(); return; }
      m.dataset.from = `${a}:${b.dataset.i || ""}`; m.dataset.i = b.dataset.i || "";
      if (a === "dmenu") popMenu(b, [LIVE && ["dsettings", "Settings and variables", "dash"], ["djson", "Copy as JSON", "copy"], LIVE && ["ddel0", "Delete dashboard", "x"]]);
      else if (p && p.type === "row") popMenu(b, [["pup", "Move up", "up"], ["pdown", "Move down", "down"], ["pedit", "Edit", "sql"], ["premove0", "Remove row", "x"]]);
      else popMenu(b, [p && p.result && ["pview", "View larger, with its rows", "ext"], LIVE && ["pedit", "Edit", "sql"], LIVE && ["pdup", "Duplicate", "plus"], p && p.result && ["pcsv", "Copy rows as CSV", "copy"],
                       LIVE && i > 0 && ["pup", "Move up", "up"], LIVE && i < DASH.panels.length - 1 && ["pdown", "Move down", "down"], LIVE && ["premove0", "Remove", "x"]]);
      return;
    }
    if (a === "prow") { const i = Number(b.dataset.i), now = !rowCollapsed(DASH, i); try { localStorage.setItem(`greenlight-row:${DASH.id}:${i}`, now ? "1" : "0"); } catch { /* per browser */ } render(); return; }
    if (a === "lgd") { const set = LEGEND_HIDE.get(b.dataset.id) || new Set(); if (!set.delete(b.dataset.s)) set.add(b.dataset.s); LEGEND_HIDE.set(b.dataset.id, set);
      const m = b.dataset.id.match(/^dp-t-(\d+)$/); if (m) drawDashPanel(Number(m[1])); else if (b.dataset.id === "dv-t") { drawerKey = null; syncDrawer(); } return; }
    if (a === "example") { const f = document.getElementById("ed"), ex = (SCHEMA_CACHE || { examples: [] }).examples[Number(b.dataset.i)];
      if (f && ex) { const F = n => f.elements.namedItem(n); F("sql").value = ex.sql; F("title").value = ex.title; F("type").value = ex.type; F("type").dispatchEvent(new Event("change")); if (ex.display) F("display").value = ex.display; } return; }
    if (a === "scroll") { const el = document.getElementById(b.dataset.to); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
    if (a === "chg") { CHANGE_AT += Number(b.dataset.d); const el = document.getElementById("insight"); if (el && CHANGES) { el.outerHTML = changeCard(CHANGES); drawChange(CHANGES); } return; }
    if (a === "starter") { if (!LIVE) return; b.disabled = true; try { const r = await post("/api/dashboards", { starter: true }); location.hash = `#/dashboards/${r.id}`; } catch (e) { b.disabled = false; toast(e.message); } return; }
    if (!LIVE) return;
    b.disabled = true;
    try {
      if (a === "qall") { const r = await post("/api/sweep", { apply: true }); toast(`Quarantined ${plural(r.to_quarantine.length, "test")}`); }
      else if (a === "q") { await post("/api/quarantine", { test_id: b.dataset.id, reason: b.dataset.why }); toast(`Quarantined ${splitId(b.dataset.id)[1]}`); }
      else if (a === "u") { await post("/api/unquarantine", { test_id: b.dataset.id }); toast(`Released ${splitId(b.dataset.id)[1]}`); }
      drawerKey = null;
      render();
    } catch (e) { b.disabled = false; toast(e.message); }
    return;
  }
  const pr = ev.target.closest("tr[data-panel]");
  if (pr && !ev.target.closest("a, button, input, select, summary, label")) { setPanel(pr.dataset.panel, !drawer.hidden); return; }
  const tr = ev.target.closest("tr[data-href]");
  if (tr && !ev.target.closest("a, button, input, select, summary, label")) location.hash = tr.dataset.href;
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.matches && ev.target.matches("th[data-col]")) sortBy(ev.target);
  if (ev.key === "Enter" && ev.target.matches && ev.target.matches("tr[data-panel]")) setPanel(ev.target.dataset.panel, !drawer.hidden);
  if (ev.key === "Escape") { closePop(); closeMenu(); document.body.classList.remove("nav-open"); tipOff(); if (!drawer.hidden) setPanel(null, true); }
  const typing = ev.target.closest && ev.target.closest("input, textarea, select, [contenteditable]");
  if (!drawer.hidden && !typing && !ev.metaKey && !ev.ctrlKey && !ev.altKey) {
    const inside = drawer.contains(document.activeElement);
    if (ev.key === "j" || (inside && ev.key === "ArrowDown")) { ev.preventDefault(); stepPanel(1); }
    if (ev.key === "k" || (inside && ev.key === "ArrowUp")) { ev.preventDefault(); stepPanel(-1); }
  }
});

/* ---------- shell: crumbs, sync status, time range, theme, nav drawer ---------- */
function setCrumbs(trail, title) {
  document.getElementById("crumbs").innerHTML = trail.map(([label, href]) => `${href ? `<a href="${href}">${esc(label)}</a>` : `<span>${esc(label)}</span>`}${icon("right")}`).join("") + `<h1>${esc(title)}</h1>`;
  document.title = `${title} · greenlight`;
}
function setSynced(synced) {
  const box = document.getElementById("sync");
  if (SNAP) { box.innerHTML = `<span class="pulse off"></span><span>Snapshot, ${esc(full(SNAP.generated_at))}</span>`; return; }
  const entries = Object.entries(synced || {});
  if (!entries.length) return;
  const latest = entries.map(e => e[1]).sort().pop();
  const stale = (NOW - new Date(latest)) / 3600000 > 24;
  box.innerHTML = `<span class="pulse${stale ? " off" : ""}"></span><span data-tip="${esc(entries.map(([k, v]) => `${k} ${ago(v)}`).join(", "))}">Synced ${esc(ago(latest))}</span>`;
}
const range = document.getElementById("range"), rangeMenu = document.getElementById("range-menu");
let windowed = true;
function syncRange() {
  document.getElementById("range-label").textContent = rangeName(DAYS);
  rangeMenu.innerHTML = RANGES.map(n => `<button type="button" role="menuitemradio" aria-checked="${n === DAYS}" data-days="${n}">${icon("check")}${rangeName(n)}</button>`).join("");
}
function closeMenu() { rangeMenu.hidden = true; range.setAttribute("aria-expanded", "false"); }
range.addEventListener("click", () => {
  if (!windowed || SNAP) return;
  const open = rangeMenu.hidden;
  rangeMenu.hidden = !open; range.setAttribute("aria-expanded", String(open));
  if (open) rangeMenu.querySelector('[aria-checked="true"]').focus();
});
rangeMenu.addEventListener("click", ev => {
  const b = ev.target.closest("button[data-days]"); if (!b) return;
  DAYS = Number(b.dataset.days);
  try { localStorage.setItem("greenlight-days", String(DAYS)); } catch { /* storage unavailable */ }
  closeMenu(); syncRange(); drawerKey = null; render();  /* an open side panel reloads for the new range too */
});
document.addEventListener("pointerdown", ev => { if (!ev.target.closest("#picker")) closeMenu(); if (!ev.target.closest("#pmenu, [data-act=pmenu], [data-act=dmenu]")) closePop(); });
const themeBtn = document.getElementById("theme");
function syncTheme() {
  const light = document.documentElement.dataset.theme === "light";
  themeBtn.innerHTML = icon(light ? "moon" : "sun");
  themeBtn.dataset.tip = light ? "Dark theme" : "Light theme";
  themeBtn.setAttribute("aria-label", themeBtn.dataset.tip);
}
themeBtn.addEventListener("click", () => {
  const light = document.documentElement.dataset.theme !== "light";
  if (light) document.documentElement.dataset.theme = "light"; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem("greenlight-theme", light ? "light" : "dark"); } catch { /* storage unavailable */ }
  syncTheme(); tipOff();
});
document.getElementById("menu-btn").addEventListener("click", () => document.body.classList.toggle("nav-open"));
document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("nav-open"));
document.getElementById("refresh").addEventListener("click", () => { CACHE.clear(); drawerKey = null; render(); });

/* ---------- router ---------- */
const ROUTES = [
  [/^#?\/?$/, "overview", [["Tests"]], "Overview", tok => overviewView(tok), true],
  [/^#\/flaky$/, "flaky", [["Tests"]], "Flaky tests", tok => flakyView(tok), true],
  [/^#\/test\/(.+)$/, "flaky", [["Tests"], ["Flaky tests", "#/flaky"]], "Test", (tok, m) => testView(tok, decodeURIComponent(m[1])), true],
  [/^#\/runs$/, "runs", [["Tests"]], "Runs", tok => runsView(tok), false],
  [/^#\/run\/(\d+)$/, "runs", [["Tests"], ["Runs", "#/runs"]], "Run", (tok, m) => runView(tok, Number(m[1])), false],
  [/^#\/quarantine$/, "quarantine", [["Tests"]], "Quarantine", tok => quarantineView(tok), true],
  [/^#\/trends$/, "trends", [["Tests"]], "Trends", tok => trendsView(tok), false],
  [/^#\/commits(?:\/(merges))?$/, "commits", [["Delivery"]], "Commits", (tok, m) => commitsView(tok, m[1] || ""), true],
  [/^#\/pipelines$/, "pipelines", [["Delivery"]], "Pipelines", tok => pipelinesView(tok), true],
  [/^#\/pipeline\/(.+)$/, "pipelines", [["Delivery"], ["Pipelines", "#/pipelines"]], "Pipeline run", (tok, m) => pipelineView(tok, decodeURIComponent(m[1])), false],
  [/^#\/delivery$/, "delivery", [["Delivery"]], "DORA and GitHub", tok => deliveryView(tok), true],
  [/^#\/dashboards$/, "dashboards", [["Explore"]], "Dashboards", tok => dashboardsView(tok), false],
  [/^#\/dashboards\/([\w-]+)$/, "dashboards", [["Explore"], ["Dashboards", "#/dashboards"]], "Dashboard", (tok, m) => dashboardView(tok, m[1]), true],
  [/^#\/sql$/, "sql", [["Explore"]], "SQL", tok => sqlView(tok), true],
  [/^#\/usage(?:\/(items|prs|tests|sessions))?$/, "usage", [["Agents"]], "Token usage", (tok, m) => usageView(tok, m[1] || ""), true],
];
let lastHash = null;
async function render() {
  const tok = ++renderToken;
  tipOff(); closeMenu(); closePop();
  if (!/^#\/dashboards\//.test(hashParts()[0])) document.body.classList.remove("tv");
  const [hash] = hashParts();
  const hit = ROUTES.map(r => [hash.match(r[0]), ...r.slice(1)]).find(r => r[0]) || [null, ...ROUTES[0].slice(1)];
  const [m, nav, trail, title, fn, isWindowed] = hit;
  windowed = isWindowed;
  range.setAttribute("aria-disabled", String(!windowed || !!SNAP));
  if (!windowed) range.dataset.tip = "This view isn't filtered by time"; else delete range.dataset.tip;
  document.querySelectorAll("#nav a").forEach(a => { if (a.dataset.nav === nav) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  setCrumbs(trail, title);
  if (pageKey() !== lastHash) { view.innerHTML = skeleton(); lastHash = pageKey(); } else view.classList.add("busy");
  const bar = document.getElementById("bar"); bar.hidden = false;
  try { await fn(tok, m); }
  catch (e) { if (tok === renderToken) view.innerHTML = errorBox(e); }
  finally { if (tok === renderToken) { bar.hidden = true; view.classList.remove("busy"); syncDrawer(); } }
}

/* the sidebar's hover highlight glides between rows */
(() => {
  const nav = document.getElementById("nav"), g = document.createElement("span");
  g.className = "glide"; nav.prepend(g);
  nav.addEventListener("pointerover", ev => { const a = ev.target.closest("a"); if (!a) return; g.style.transform = `translateY(${a.offsetTop}px)`; g.classList.add("on"); });
  nav.addEventListener("pointerleave", () => g.classList.remove("on"));
})();
document.getElementById("search-btn").addEventListener("click", cmdkOpen);
document.querySelector("#search-btn kbd").textContent = /Mac|iPhone|iPad/.test(navigator.platform || "") ? "\u2318K" : "Ctrl K";
document.getElementById("cmdk").addEventListener("pointerdown", ev => { if (ev.target.id === "cmdk") cmdkClose(); });
document.getElementById("cmdk-q").addEventListener("input", () => { cmdk.at = 0; cmdkDraw(); });
document.getElementById("cmdk-q").addEventListener("keydown", ev => {
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") { ev.preventDefault(); cmdkMove(ev.key === "ArrowDown" ? 1 : -1); }
  if (ev.key === "Enter") { ev.preventDefault(); cmdkGo(cmdk.at); }
  if (ev.key === "Escape") { ev.preventDefault(); ev.stopPropagation(); cmdkClose(); }
});
document.getElementById("cmdk-list").addEventListener("click", ev => { const b = ev.target.closest(".ci"); if (b) cmdkGo(Number(b.dataset.i)); });
document.getElementById("cmdk-list").addEventListener("pointermove", ev => { const b = ev.target.closest(".ci"); if (b && Number(b.dataset.i) !== cmdk.at) { cmdk.at = Number(b.dataset.i); cmdkMove(0); } });
document.addEventListener("keydown", ev => {
  const typing = ev.target.closest && ev.target.closest("input, textarea, select, [contenteditable]");
  if ((ev.key === "k" && (ev.metaKey || ev.ctrlKey)) || (ev.key === "/" && !typing)) { ev.preventDefault(); if (document.getElementById("cmdk").hidden) cmdkOpen(); else cmdkClose(); }
});

/* ---------- boot ---------- */
if (SNAP) {
  document.getElementById("picker").hidden = true;
  document.getElementById("refresh").hidden = true;
  const chip = document.getElementById("snapchip");
  chip.hidden = false;
  chip.textContent = `Snapshot, last ${SNAP.days} days`;
  chip.dataset.tip = `Read-only, taken ${full(SNAP.generated_at)}`;
  setSynced(null);
}
syncRange(); syncTheme();
window.addEventListener("hashchange", () => {
  if (pageKey() === lastHash) { syncDrawer(); return; }  /* only the side panel changed */
  document.body.classList.remove("nav-open"); closeDrawerUI(); render(); view.focus({ preventScroll: true }); window.scrollTo(0, 0);
});
/* a browser signed in with a cookie (the hosted server) gets a way out */
if (LIVE) api("/api/session").then(s => { if (s.auth === "cookie") document.getElementById("signout").hidden = false; }).catch(() => {});
render().then(() => {
  /* the sidebar's sync status comes with the overview; fetch it once when starting elsewhere */
  if (location.hash && location.hash !== "#/" && LIVE) api("/api/overview", { days: DAYS }).then(d => setSynced(d.synced)).catch(() => {});
});
</script>
</body>
