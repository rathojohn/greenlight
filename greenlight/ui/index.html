PANELS.cat = async id => {
  const d = await api("/api/usage/detail", { days: DAYS, kind: "category", key: id }), c = d.category;
  return {
    title: esc(ctxName(id)), sub: esc(CTX_HINT[id] || ""),
    body: facts([["Cost", tk(c.weighted || 0), COST_TIP], ["Re-read", tk(c.carried_tokens || 0), "Cache reads of these tokens by later requests"], ["Added", tk(c.tokens || 0)], ["Calls", tk(c.calls || 0)]])
      + `<p class="advice">${esc(CTX_ADVICE[id] || (id.startsWith("mcp:") ? "Results from this MCP server stay in context. Prefer its narrow tools and small page sizes." : ""))}</p>`
      + section("Sessions that spent the most on it", boxed(table("d-csess", sessionCols, d.sessions, { sort: 2, limit: 6, panel: x => `session:${x.session_id}` })))
      + (d.prs.length ? section("Pull requests", boxed(table("d-cprs", [
          { h: "#", cell: p => p.number, sort: p => p.number, cls: "num" },
          { h: "Pull request", cell: p => esc(p.title || ""), sort: p => p.title, dir: 1, cls: "wrap" },
          { h: "Cost", cell: p => tk(p.weighted), sort: p => p.weighted, cls: "num" },
        ], d.prs, { sort: 2, limit: 6, panel: p => `pr:${p.number}` }))) : ""),
  };
};
async function itemPanel(kind, id) {
  const [k, ...rest] = id.split(":"), label = rest.join(":");
  const d = await api("/api/usage/detail", { days: DAYS, kind, key: `${k}:${label}` }), r = d.item;
  const each = r.adds ? r.tokens / r.adds : 0;
  return {
    title: `<span class="mono">${esc(label)}</span>`, sub: `${esc(kindName(k))}${kind === "group" ? `, ${plural(r.labels || d.rows.length, "item")}` : ""}`,
    body: facts([["Cost", tk(r.weighted), COST_TIP], ["Tokens each time", tk(each), "Its size when it entered the context"],
                 ["Rode along", `${tk(r.avg_rides)} <small class="dim">requests</small>`, `On average each time it entered; ${tk(r.max_rides)} at most`],
                 ["Times added", tk(r.adds), `In ${plural(r.sessions, "session")}`]])
      + `<p class="advice">${esc(KIND_ADVICE[k] || "")}</p>`
      + ((d.prs || []).length ? section("By pull request", boxed(table("d-itemprs", [
          { h: "#", cell: p => p.number, sort: p => p.number, cls: "num" },
          { h: "Pull request", cell: p => esc(p.title || ""), sort: p => p.title, dir: 1, cls: "wrap" },
          { h: "Carried", cell: p => tk(p.rides), sort: p => p.rides, cls: "num", tip: "Requests on that pull request's branch that read it again" },
          { h: "Re-read", cell: p => tk(p.carried_tokens), sort: p => p.carried_tokens, cls: "num" },
        ], d.prs, { sort: 3, limit: 6, panel: p => `pr:${p.number}` }))) : "")
      + section(kind === "group" ? "Items" : "Sessions", boxed(table("d-item", [
          kind === "group" ? { h: "Item", cell: x => `<span class="mono">${esc(x.label)}</span>`, sort: x => x.label, dir: 1, cls: "wrap" }
                           : { h: "Session", cell: x => esc(sessionName(x)), sort: x => sessionName(x), dir: 1, cls: "mono" },
          { h: "Added", cell: x => x.adds, sort: x => x.adds, cls: "num" },
          { h: "Rode along", cell: x => tk(x.adds ? Math.round(x.rides / x.adds) : 0), sort: x => x.rides / (x.adds || 1), cls: "num" },
          { h: "Re-read", cell: x => tk(x.carried_tokens), sort: x => x.carried_tokens, cls: "num" },
        ], d.rows, { sort: 3, limit: 10, panel: x => kind === "group" ? `item:${x.kind}:${x.label}` : `session:${x.session_id}` }))),
  };
}
PANELS.item = id => itemPanel("item", id);
PANELS.group = id => itemPanel("group", id);
PANELS.waste = async id => {
  const w = WASTE[id];
  if (!w) throw new ApiError("Nothing like that here.", 404);
  const d = await api("/api/usage/detail", { days: DAYS, kind: "waste", key: id });
  const who = { h: "Session", cell: r => esc(sessionName(r)), sort: r => sessionName(r), dir: 1, cls: "mono" };
  const cols = id === "switches" ? [
      { h: "When", cell: r => when(r.at), sort: r => r.at, cls: "nw hide-sm" }, who,
      { h: "New branch", cell: r => `${esc(r.to_branch)}<div class="sub">after ${esc(r.from_branch)}</div>`, cls: "wrap" },
      { h: "Re-read", cell: r => tk(r.carried_tokens), sort: r => r.carried_tokens, cls: "num" }]
    : id === "idle" ? [
      { h: "When", cell: r => when(r.at), sort: r => r.at, cls: "nw hide-sm" }, who,
      { h: "Idle", cell: r => hrs(r.idle_seconds / 3600), sort: r => r.idle_seconds, cls: "num" },
      { h: "Rewritten", cell: r => tk(r.tokens), sort: r => r.tokens, cls: "num" }]
    : [who, { h: "Reads", cell: r => r.repeat_reads, sort: r => r.repeat_reads, cls: "num" },
      { h: "Tokens", cell: r => tk(r.repeat_tokens), sort: r => r.repeat_tokens, cls: "num" }];
  return {
    title: esc(w.title), sub: `The largest in the last ${DAYS} days`,
    body: `<p class="advice">${esc(w.advice)}</p>` + boxed(table("d-waste", cols, d.rows, { sort: id === "repeats" ? 2 : 3, limit: 10, panel: r => `session:${r.session_id}`, empty: "None in this window." })),
  };
};

const USAGE_TABS = [["", "Overview"], ["items", "In context"], ["prs", "Pull requests"], ["tests", "Tests"], ["sessions", "Sessions"]];
const KIND_NAMES = { instructions: "Instructions", image: "Image", file: "File", command: "Command output", skill: "Skill", reminder: "Claude Code note", mcp: "MCP tool", web: "Web", subagent: "Subagent report", tool: "Tool" };
const KIND_ADVICE = {
  instructions: "Loaded into every session and subagent, and read again by every request. Keep it to what most tasks need; what only some tasks need can move into a skill or a doc Claude reads when it needs it.",
  image: "An image stays in context for the rest of the session. Look at screenshots in a subagent and keep only its verdict, or compact after a batch of them.",
  file: "A file read stays until the session compacts. Read only the lines needed: an offset and limit, or Grep first.",
  command: "Command output stays in context. Pipe long output through tail or grep, or into a file to read the part that matters.",
  skill: "A skill's text loads once and stays. Fine for one used throughout a session; a one-off is cheaper in a subagent.",
  reminder: "Notes Claude Code adds on its own. Task list reminders come while a task list is open and untouched: keeping it current, or clearing it when the work is done, stops them.",
  mcp: "Results from this MCP tool stay in context. Prefer its narrow tools and small page sizes.",
  web: "Fetched pages stay in context. Ask WebFetch a narrow question so it returns less.",
  subagent: "A subagent's report stays in the main context. Ask for short reports.",
  tool: "Results of this tool stay in context.",
};
const kindName = k => KIND_NAMES[k] || k;
function itemCols(total, key) {
  return [
    { h: "What", cell: r => `<span class="mono">${esc(r[key])}</span><div class="sub">${esc(kindName(r.kind))}${r.labels > 1 ? `, ${plural(r.labels, "item")}` : ""}</div>`, sort: r => r[key], dir: 1, cls: "wrap" },
    { h: "Added", cell: r => tk(r.adds), sort: r => r.adds, cls: "num hide-sm", tip: "Times it entered a context: a read, a command run, a session or subagent starting" },
    { h: "Rode along", cell: r => `${tk(r.avg_rides)}<span class="dim"> / ${tk(r.max_rides)}</span>`, sort: r => r.avg_rides, cls: "num", tip: "Requests that read it again after it entered, on average and at most" },
    { h: "Share of cost", cell: r => meter(r.weighted, total), sort: r => r.weighted, cls: "num nw" },
  ];
}
async function usageView(tok, tab = "") {
  const d = await api("/api/usage", { days: DAYS });
  if (tok !== renderToken) return;
  const t = d.totals;
  if (!t.requests) {
    view.innerHTML = `<div class="grid">${noData(`No token usage in the last ${DAYS} days.`, "<code>greenlight setup --project</code> adds a hook that records each Claude Code session's token counts after every turn: counts, branches and times, never prompts or code.")}</div>`;
    return;
  }
  const cx = d.context || { categories: [], rebuilds: { by_cause: [] }, task_switches: {} };
  const pct = n => shareOf(n, t.weighted);
  const tokCols = [
    { h: "Cost", cell: r => tk(r.weighted), sort: r => r.weighted, cls: "num", tip: COST_TIP },
    { h: "Output", cell: r => tk(r.output_tokens), sort: r => r.output_tokens, cls: "num hide-sm" },
    { h: "Cache reads", cell: r => tk(r.cache_read_tokens), sort: r => r.cache_read_tokens, cls: "num hide-sm" },
  ];
  const counts = { items: ((d.items || {}).items || []).length, prs: d.by_pr.length, tests: d.by_test.length, sessions: d.sessions.length };
  const tabs = `<nav class="tabs" aria-label="Token usage">${USAGE_TABS.map(([k, label]) => `<a href="#/usage${k ? "/" + k : ""}"${k === tab ? ` aria-current="page"` : ""}>${label}${k ? ` <span class="n">${counts[k]}</span>` : ""}</a>`).join("")}</nav>`;
  const tiles = `<div class="grid">
      ${stat({ cls: "s3", k: "Cost", v: tk(t.weighted), s: "in input tokens", spark: d.weighted_per_day, tip: COST_TIP })}
      ${stat({ cls: "s3", k: "Output tokens", v: tk(t.output_tokens), s: `${tk(t.requests)} requests`, spark: d.output_per_day })}
      ${stat({ cls: "s3", k: "Cache reads", v: tk(t.cache_read_tokens), s: `${pct(t.cache_read_tokens * 0.1)} of cost`, spark: d.cache_read_per_day, tip: "Earlier context read back from the prompt cache by every request. Cheap per token, but the biggest number." })}
      ${stat({ cls: "s3", k: "Sessions", v: t.sessions, s: d.models.map(m => m.model).slice(0, 2).join(", ") })}
    </div>${tabs}`;
  let body = "";
  if (tab === "prs") {
    const un = d.unattributed;
    body = `<div class="grid">${panel({ title: "By pull request", tip: "Tokens spent on each PR's branch until it merged or closed. A branch name a later PR reuses counts toward that one.", flush: true,
      body: table("t-upr", [
        { h: "#", cell: p => p.number, sort: p => p.number, cls: "num" },
        { h: "Pull request", cell: p => `${esc(p.title || "")}<div class="sub">${esc(p.head || "")}</div>`, sort: p => p.title, dir: 1, cls: "wrap" },
        { h: "Sessions", cell: p => p.sessions, sort: p => p.sessions, cls: "num hide-sm" },
        ...tokCols,
        { h: "State", cell: p => prState(p.state), sort: p => p.state, dir: 1, cls: "hide-sm" },
      ], d.by_pr, { sort: 3, limit: 15, panel: p => `pr:${p.number}`, empty: "No usage on a pull request's branch yet." }),
      foot: un.weighted ? `${tk(un.weighted)} of the cost was on branches without a pull request, like main.` : "" })}</div>`;
  } else if (tab === "tests") {
    body = `<div class="grid">${panel({ title: "While a test was red", tip: "Tokens a session spent from a run that failed the test to the next run in that session that passed it. Two tests red at once both count the same tokens.", flush: true,
      body: table("t-utest", [
        { h: "Test", cell: x => { const [cls, name] = splitId(x.test_id); return `<span class="mono">${esc(name)}</span>${cls ? `<div class="sub mono">${esc(cls)}</div>` : ""}`; }, sort: x => x.test_id, dir: 1, cls: "wrap" },
        { h: "Times red", cell: x => `${x.times_red}${x.still_red ? `<span class="dim">, ${x.still_red} unfixed</span>` : ""}`, sort: x => x.times_red, cls: "num", tip: "Failed in a session; unfixed means no later run in that session passed it" },
        ...tokCols,
      ], d.by_test, { sort: 2, limit: 15, panel: x => `utest:${x.test_id}`, empty: "No test failed in a session that recorded usage." }) })}</div>`;
  } else if (tab === "items") {
    const it = d.items || { items: [], groups: [] };
    body = `<div class="grid">
      ${panel({ title: "Together", flush: true, tip: "Items that belong together: a folder and extension, one program's commands, one MCP server.",
        body: table("t-groups", itemCols(t.weighted, "grp"), it.groups, { sort: 3, limit: 5, panel: r => `group:${r.kind}:${r.grp}`, empty: "No groups yet." }) })}
    </div>
    <div class="grid">
      ${panel({ title: "What rode along", flush: true, tip: "Each thing that entered a context, and how many requests read it again after: a screenshot read early stays for the rest of the session. CLAUDE.md rides with every request of every session and subagent.",
        body: table("t-items", itemCols(t.weighted, "label"), it.items, { sort: 3, limit: 10, panel: r => `item:${r.kind}:${r.label}`, empty: "Nothing yet: items come from the usage hook in this version of greenlight." }) })}
    </div>`;
  } else if (tab === "sessions") {
    body = `<div class="grid">${panel({ title: "Sessions", flush: true,
      body: table("t-usess", [
        { h: "Last active", cell: x => when(x.last_at), sort: x => x.last_at, cls: "nw" },
        { h: "Session", cell: x => `<span class="mono">${esc(sessionName(x))}</span><div class="sub">${esc(x.branches.slice(0, 3).join(", "))}${x.branches.length > 3 ? ", ..." : ""}</div>`, sort: x => sessionName(x), dir: 1, cls: "wrap" },
        { h: "Requests", cell: x => x.requests, sort: x => x.requests, cls: "num hide-sm" },
        ...tokCols,
      ], d.sessions, { sort: 0, limit: 15, panel: x => `session:${x.session_id}` }) })}</div>`;
  } else {
    const sw = cx.task_switches || {};
    const idle = (cx.rebuilds.by_cause || []).find(c => c.cause === "idle") || { rebuilds: 0, tokens: 0, weighted: 0 };
    const drop = [
      { k: WASTE.switches.title, v: tk(sw.carried_tokens || 0), href: panelHref("waste:switches"), tip: WASTE.switches.advice,
        s: sw.count ? `${pct(sw.weighted)} of cost, ${plural(sw.count, "new branch", "new branches")} started with ${tk(Math.round(sw.context_tokens / sw.count))} on average` : "no new branch started in a full context" },
      { k: WASTE.idle.title, v: tk(idle.tokens), href: panelHref("waste:idle"), tip: WASTE.idle.advice,
        s: idle.rebuilds ? `${pct(idle.weighted)} of cost, ${plural(idle.rebuilds, "rebuild")}` : "none" },
      { k: WASTE.repeats.title, v: tk(cx.repeat_tokens || 0), href: panelHref("waste:repeats"), tip: WASTE.repeats.advice,
        s: cx.repeat_reads ? `${plural(cx.repeat_reads, "read")} of a file already in context, unchanged` : "none" },
    ];
    body = `<div class="grid">
      ${panel({ cls: "s4", title: "Cost per day", tip: COST_TIP, body: `<div class="chart" id="c-cost"></div>` })}
      ${panel({ cls: "s4", title: "Output per day", body: `<div class="chart" id="c-out"></div>` })}
      ${panel({ cls: "s4", title: "Cache reads per day", body: `<div class="chart" id="c-cache"></div>` })}
    </div>
    <div class="grid">
      ${panel({ cls: "s8", title: "Where context goes", flush: true, tip: "Everything a request sends is read again by every request after it, until the session compacts. This splits those reads by what put the tokens there. Open a row for what to do about it.",
        body: table("t-uctx", [
          { h: "What", cell: c => `${esc(ctxName(c.category))}<div class="sub">${esc(CTX_HINT[c.category] || "")}</div>`, sort: c => ctxName(c.category), dir: 1, cls: "wrap" },
          { h: "Calls", cell: c => c.calls ? tk(c.calls) : "", sort: c => c.calls, cls: "num hide-sm", tip: "Tool calls, or requests for the system prompt" },
          { h: "Added", cell: c => tk(c.tokens), sort: c => c.tokens, cls: "num hide-sm", tip: "Tokens put into the context" },
          { h: "Re-read", cell: c => tk(c.carried_tokens), sort: c => c.carried_tokens, cls: "num", tip: "Cache reads of them by every later request, until a compaction" },
          { h: "Share of cost", cell: c => meter(c.weighted, t.weighted), sort: c => c.weighted, cls: "num nw" },
        ], cx.categories, { sort: 4, limit: 8, panel: c => `cat:${c.category}`, empty: "No context breakdown yet: it comes from the usage hook in this version of greenlight." }) })}
      <div class="s4 stack">${drop.map(x => stat(x)).join("")}</div>
    </div>`;
  }
  view.innerHTML = tiles + body;
  if (!tab) {
    chart(document.getElementById("c-cost"), { days: d.days, label: "Cost per day, in input tokens", format: "tok", bars: [{ values: d.weighted_per_day, color: "var(--series)", label: "Cost" }] });
    chart(document.getElementById("c-out"), { days: d.days, label: "Output tokens per day", format: "tok", bars: [{ values: d.output_per_day, color: "var(--series)", label: "Output" }] });
    chart(document.getElementById("c-cache"), { days: d.days, label: "Cache reads per day", format: "tok", bars: [{ values: d.cache_read_per_day, color: "var(--neutral)", label: "Cache reads" }] });
  }
}

/* ---------- actions (quarantine, pages, side panels) ---------- */
document.addEventListener("click", async ev => {
  const th = ev.target.closest("th[data-col]");
  if (th) { sortBy(th); return; }
  const b = ev.target.closest("button[data-act]");
  if (b) {
    const a = b.dataset.act;
    if (a === "page") { const T = TABLES[b.dataset.t]; T.page += Number(b.dataset.d); document.getElementById(b.dataset.t).innerHTML = tableInner(b.dataset.t); stepButtons(); return; }
    if (a === "step") { stepPanel(Number(b.dataset.d)); return; }
    if (a === "close") { setPanel(null, true); return; }
    if (!LIVE) return;
    b.disabled = true;
    try {
      if (a === "qall") { const r = await post("/api/sweep", { apply: true }); toast(`Quarantined ${plural(r.to_quarantine.length, "test")}`); }
      else if (a === "q") { await post("/api/quarantine", { test_id: b.dataset.id, reason: b.dataset.why }); toast(`Quarantined ${splitId(b.dataset.id)[1]}`); }
      else if (a === "u") { await post("/api/unquarantine", { test_id: b.dataset.id }); toast(`Released ${splitId(b.dataset.id)[1]}`); }
      drawerKey = null;
      render();
    } catch (e) { b.disabled = false; toast(e.message); }
    return;
  }
  const pr = ev.target.closest("tr[data-panel]");
  if (pr && !ev.target.closest("a, button, input, select, summary, label")) { setPanel(pr.dataset.panel, !drawer.hidden); return; }
  const tr = ev.target.closest("tr[data-href]");
  if (tr && !ev.target.closest("a, button, input, select, summary, label")) location.hash = tr.dataset.href;
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.matches && ev.target.matches("th[data-col]")) sortBy(ev.target);
  if (ev.key === "Enter" && ev.target.matches && ev.target.matches("tr[data-panel]")) setPanel(ev.target.dataset.panel, !drawer.hidden);
  if (ev.key === "Escape") { closeMenu(); document.body.classList.remove("nav-open"); tipOff(); if (!drawer.hidden) setPanel(null, true); }
  const typing = ev.target.closest && ev.target.closest("input, textarea, select, [contenteditable]");
  if (!drawer.hidden && !typing && !ev.metaKey && !ev.ctrlKey && !ev.altKey) {
    const inside = drawer.contains(document.activeElement);
    if (ev.key === "j" || (inside && ev.key === "ArrowDown")) { ev.preventDefault(); stepPanel(1); }
    if (ev.key === "k" || (inside && ev.key === "ArrowUp")) { ev.preventDefault(); stepPanel(-1); }
  }
});

/* ---------- shell: crumbs, sync status, time range, theme, nav drawer ---------- */
function setCrumbs(trail, title) {
  document.getElementById("crumbs").innerHTML = trail.map(([label, href]) => `${href ? `<a href="${href}">${esc(label)}</a>` : `<span>${esc(label)}</span>`}${icon("right")}`).join("") + `<h1>${esc(title)}</h1>`;
  document.title = `${title} · greenlight`;
}
function setSynced(synced) {
  const box = document.getElementById("sync");
  if (SNAP) { box.innerHTML = `<span class="pulse off"></span><span>Snapshot, ${esc(full(SNAP.generated_at))}</span>`; return; }
  const entries = Object.entries(synced || {});
  if (!entries.length) return;
  const latest = entries.map(e => e[1]).sort().pop();
  const stale = (NOW - new Date(latest)) / 3600000 > 24;
  box.innerHTML = `<span class="pulse${stale ? " off" : ""}"></span><span data-tip="${esc(entries.map(([k, v]) => `${k} ${ago(v)}`).join(", "))}">Synced ${esc(ago(latest))}</span>`;
}
const range = document.getElementById("range"), rangeMenu = document.getElementById("range-menu");
let windowed = true;
function syncRange() {
  document.getElementById("range-label").textContent = `Last ${DAYS} days`;
  rangeMenu.innerHTML = RANGES.map(n => `<button type="button" role="menuitemradio" aria-checked="${n === DAYS}" data-days="${n}">${icon("check")}Last ${n} days</button>`).join("");
}
function closeMenu() { rangeMenu.hidden = true; range.setAttribute("aria-expanded", "false"); }
range.addEventListener("click", () => {
  if (!windowed || SNAP) return;
  const open = rangeMenu.hidden;
  rangeMenu.hidden = !open; range.setAttribute("aria-expanded", String(open));
  if (open) rangeMenu.querySelector('[aria-checked="true"]').focus();
});
rangeMenu.addEventListener("click", ev => {
  const b = ev.target.closest("button[data-days]"); if (!b) return;
  DAYS = Number(b.dataset.days);
  try { localStorage.setItem("greenlight-days", String(DAYS)); } catch { /* storage unavailable */ }
  closeMenu(); syncRange(); drawerKey = null; render();  /* an open side panel reloads for the new range too */
});
document.addEventListener("pointerdown", ev => { if (!ev.target.closest("#picker")) closeMenu(); });
const themeBtn = document.getElementById("theme");
function syncTheme() {
  const light = document.documentElement.dataset.theme === "light";
  themeBtn.innerHTML = icon(light ? "moon" : "sun");
  themeBtn.dataset.tip = light ? "Dark theme" : "Light theme";
  themeBtn.setAttribute("aria-label", themeBtn.dataset.tip);
}
themeBtn.addEventListener("click", () => {
  const light = document.documentElement.dataset.theme !== "light";
  if (light) document.documentElement.dataset.theme = "light"; else delete document.documentElement.dataset.theme;
  try { localStorage.setItem("greenlight-theme", light ? "light" : "dark"); } catch { /* storage unavailable */ }
  syncTheme(); tipOff();
});
document.getElementById("menu-btn").addEventListener("click", () => document.body.classList.toggle("nav-open"));
document.getElementById("scrim").addEventListener("click", () => document.body.classList.remove("nav-open"));
document.getElementById("refresh").addEventListener("click", () => { CACHE.clear(); drawerKey = null; render(); });

/* ---------- router ---------- */
const ROUTES = [
  [/^#?\/?$/, "overview", [["Tests"]], "Overview", tok => overviewView(tok), true],
  [/^#\/flaky$/, "flaky", [["Tests"]], "Flaky tests", tok => flakyView(tok), true],
  [/^#\/test\/(.+)$/, "flaky", [["Tests"], ["Flaky tests", "#/flaky"]], "Test", (tok, m) => testView(tok, decodeURIComponent(m[1])), true],
  [/^#\/runs$/, "runs", [["Tests"]], "Runs", tok => runsView(tok), false],
  [/^#\/run\/(\d+)$/, "runs", [["Tests"], ["Runs", "#/runs"]], "Run", (tok, m) => runView(tok, Number(m[1])), false],
  [/^#\/quarantine$/, "quarantine", [["Tests"]], "Quarantine", tok => quarantineView(tok), true],
  [/^#\/trends$/, "trends", [["Tests"]], "Trends", tok => trendsView(tok), false],
  [/^#\/pipelines$/, "pipelines", [["Delivery"]], "Pipelines", tok => pipelinesView(tok), true],
  [/^#\/pipeline\/(.+)$/, "pipelines", [["Delivery"], ["Pipelines", "#/pipelines"]], "Pipeline run", (tok, m) => pipelineView(tok, decodeURIComponent(m[1])), false],
  [/^#\/delivery$/, "delivery", [["Delivery"]], "DORA and GitHub", tok => deliveryView(tok), true],
  [/^#\/usage(?:\/(items|prs|tests|sessions))?$/, "usage", [["Agents"]], "Token usage", (tok, m) => usageView(tok, m[1] || ""), true],
];
let lastHash = null;
async function render() {
  const tok = ++renderToken;
  tipOff(); closeMenu();
  const [hash] = hashParts();
  const hit = ROUTES.map(r => [hash.match(r[0]), ...r.slice(1)]).find(r => r[0]) || [null, ...ROUTES[0].slice(1)];
  const [m, nav, trail, title, fn, isWindowed] = hit;
  windowed = isWindowed;
  range.setAttribute("aria-disabled", String(!windowed || !!SNAP));
  if (!windowed) range.dataset.tip = "This view isn't filtered by time"; else delete range.dataset.tip;
  document.querySelectorAll("#nav a").forEach(a => { if (a.dataset.nav === nav) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  setCrumbs(trail, title);
  if (hash !== lastHash) { view.innerHTML = skeleton(); lastHash = hash; } else view.classList.add("busy");
  const bar = document.getElementById("bar"); bar.hidden = false;
  try { await fn(tok, m); }
  catch (e) { if (tok === renderToken) view.innerHTML = errorBox(e); }
  finally { if (tok === renderToken) { bar.hidden = true; view.classList.remove("busy"); syncDrawer(); } }
}

/* ---------- boot ---------- */
if (SNAP) {
  document.getElementById("picker").hidden = true;
  document.getElementById("refresh").hidden = true;
  const chip = document.getElementById("snapchip");
  chip.hidden = false;
  chip.textContent = `Snapshot, last ${SNAP.days} days`;
  chip.dataset.tip = `Read-only, taken ${full(SNAP.generated_at)}`;
  setSynced(null);
}
syncRange(); syncTheme();
window.addEventListener("hashchange", () => {
  if (hashParts()[0] === lastHash) { syncDrawer(); return; }  /* only the side panel changed */
  document.body.classList.remove("nav-open"); closeDrawerUI(); render(); view.focus({ preventScroll: true }); window.scrollTo(0, 0);
});
/* a browser signed in with a cookie (the hosted server) gets a way out */
if (LIVE) api("/api/session").then(s => { if (s.auth === "cookie") document.getElementById("signout").hidden = false; }).catch(() => {});
render().then(() => {
  /* the sidebar's sync status comes with the overview; fetch it once when starting elsewhere */
  if (location.hash && location.hash !== "#/" && LIVE) api("/api/overview", { days: DAYS }).then(d => setSynced(d.synced)).catch(() => {});
});
</script>
